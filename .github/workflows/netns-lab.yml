# Стенд на настоящем ядре Linux (ТЗ 14): выход сервера через другой сервер
# (ТЗ 10) и Docker (ТЗ 7) проверяются по-настоящему — сетевые пространства
# имён и пары veth вместо машин, настоящие ip rule / nftables / iptables /
# systemd, настоящий sshd и настоящий ssh_tunnel_vpn_linux. Наружу стенд не
# ходит: «интернет» — пространство inet (test/netns/lab.sh).
#
# Матрица: rp_filter 0, 1 и 2 — у серверов и домашних машин бывает любой.
name: netns-lab

on:
  push:
    branches: ["claude/**"]
    paths:
      - "vpn/vpnlayer/**"
      - "vpn/cmd/**"
      - "src/internal/docker/**"
      - "src/internal/panel/egress*"
      - "src/internal/core/**"
      - "src/internal/tunnel/**"
      - "android/core/*.go"
      - "test/netns/**"
      - ".github/workflows/netns-lab.yml"
  pull_request:
    paths:
      - "vpn/vpnlayer/**"
      - "vpn/cmd/**"
      - "src/internal/docker/**"
      - "src/internal/panel/egress*"
      - "src/internal/core/**"
      - "src/internal/tunnel/**"
      - "android/core/*.go"
      - "test/netns/**"
      - ".github/workflows/netns-lab.yml"
  workflow_dispatch:
    inputs:
      hang:
        description: "Проверка самого стенда: нарочно повиснуть в точке (start / dockerd / tunnel)"
        required: false
        default: ""
      limit:
        description: "Предел сценария, секунд"
        required: false
        default: "600"

jobs:
  lab:
    runs-on: ubuntu-latest
    # Весь прогон — около 10 минут; сценарий снимает свой предел (run.sh)
    # заметно раньше предела задания, чтобы журнал успел уйти.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [egress, docker]
        rp: [0, 1, 2]
    name: ${{ matrix.suite }} (rp_filter=${{ matrix.rp }})
    env:
      LAB: /tmp/sshlab

    steps:
      - uses: actions/checkout@v4

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Собрать клиент VPN, labd и тест панели
        run: |
          mkdir -p "$LAB"
          ( cd vpn && CGO_ENABLED=0 go build -o "$LAB/ssh_tunnel_vpn_linux" ./cmd/ssh_tunnel_vpn_linux )
          ( cd test/netns/labd && CGO_ENABLED=0 go build -o "$LAB/labd" . )
          ( cd src && go test -c -tags netnslab -o "$LAB/panel.test" ./internal/panel )

      - name: Пакеты
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server nftables iptables jq curl >/dev/null
          uname -a; nft --version; iptables --version; docker --version; systemctl --version | head -1

      - name: Образ busybox
        if: matrix.suite == 'docker'
        run: docker pull -q busybox:1.36

      - name: Стенд
        # run.sh: сценарий в своём сеансе с журналом в файл, вывод вживую,
        # сторож машины сборки и свой предел (по умолчанию 600 с) — задолго
        # до предела шага и задания: снятое GitHub задание журнала не оставляет.
        timeout-minutes: 15
        env:
          LAB_HANG: ${{ inputs.hang }}
        run: sudo --preserve-env=LAB,LAB_HANG RP=${{ matrix.rp }} bash test/netns/run.sh ${{ matrix.suite }} ${{ inputs.limit || '600' }}

      - name: Журналы стенда
        if: always()
        run: |
          sudo journalctl -u 'ssh_tunnel_egress*' --no-pager -n 200 > "$LAB/journal-egress.txt" 2>&1 || true
          sudo mkdir -p "$LAB/out"
          sudo sh -c 'cp "$0"/*.log "$0"/*.txt "$0/out/" 2>/dev/null; chmod -R a+rX "$0/out"' "$LAB" || true
          ls -la "$LAB/out" || true

      - name: Выгрузить журналы
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-${{ matrix.suite }}-rp${{ matrix.rp }}
          path: ${{ env.LAB }}/out/
          retention-days: 14
          if-no-files-found: warn
