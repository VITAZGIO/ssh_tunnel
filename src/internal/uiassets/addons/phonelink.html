<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Связь с телефоном</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../pages.css">
<style>
  body{background:transparent}
  .wrap{display:flex;flex-direction:column;gap:10px;padding:12px 14px 16px}
  .devs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .dev{flex:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer;min-width:120px;text-align:left;color:var(--text);font:inherit}
  .dev.on{border-color:var(--accent);background:var(--card2)}
  .dev.off{opacity:.5}
  .dev b{display:block}
  .dev small{color:var(--dim)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
  .tile{display:flex;flex-direction:column;gap:8px}
  .tile h3{margin:0;font-size:14px;display:flex;gap:8px;align-items:center}
  .tile h3 .mi{width:18px;height:18px;color:var(--accent)}
  .media{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .media button,.big{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:10px 0;font-size:18px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .media button:active,.big:active{background:var(--accent-muted)}
  .big{font-size:15px;padding:12px}
  #pad{height:200px;border:1px dashed var(--line);border-radius:12px;background:var(--card2);touch-action:none;display:grid;place-items:center;color:var(--dim);font-size:12.5px;user-select:none;-webkit-user-select:none}
  .padbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .bar{display:flex;gap:8px;align-items:center}
  .bar input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);font:inherit;min-width:0}
  .n{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .n:last-child{border-bottom:0}
  .n .h{display:flex;gap:8px;color:var(--dim);font-size:12px}
  .n b{display:block;margin-top:2px}
  .ok{color:var(--ok)}.err{color:var(--err)}
  .ck{display:flex;gap:10px;align-items:center;font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="devs" id="devs"></div>
  <div class="hint" id="msg"></div>
  <div class="grid">
    <div class="card tile"><h3 id="tFind"></h3><button class="big" id="ring"></button><div class="hint" id="hFind"></div></div>
    <div class="card tile"><h3 id="tMedia"></h3>
      <div class="media"><button data-k="prev">⏮</button><button data-k="playpause">⏯</button><button data-k="next">⏭</button>
        <button data-k="voldown">🔉</button><button data-k="mute">🔇</button><button data-k="volup">🔊</button></div></div>
  </div>
  <div class="card tile" id="padCard"><h3 id="tPad"></h3>
    <div id="pad"></div>
    <div class="padbtns"><button class="big" id="lc"></button><button class="big" id="rc"></button></div>
    <div class="bar"><input id="txt"><button class="btn" id="send"></button></div>
  </div>
  <div class="card tile"><h3 id="tNot"></h3><div id="nots"></div></div>
  <div class="card tile"><h3 id="tSet"></h3>
    <label class="ck" id="rowSend"><input type="checkbox" id="sSend"><span id="lSend"></span></label>
    <div id="access"></div>
    <label class="ck"><input type="checkbox" id="sCtl"><span id="lCtl"></span></label>
  </div>
</div>
<script src="../pages.js"></script>
<script>
/* Связь с телефоном: выбрал устройство — найти его, музыка, мышь и текст
   (на ПК), уведомления с других устройств, заряд. Всё — /api/phonelink. */
let ST = null, PEER = '';
const say = (t, cls) => { $('msg').textContent = t || ''; $('msg').className = 'hint ' + (cls || ''); };
async function act(op, extra){
  if(!PEER){ say(L('Выбери устройство сверху.', 'Pick a device above.'), 'err'); return; }
  const r = await api('/api/phonelink', {op, peer: PEER, ...extra}).catch(e => ({error: String(e)}));
  if(r.error) say(r.error, 'err'); else if(op !== 'mouse') say(L('Готово', 'Done'), 'ok');
  return r;
}
async function load(){
  ST = await api('/api/phonelink').catch(() => null);
  if(!ST) return;
  const peers = ST.peers || [];
  if(!PEER || !peers.some(p => p.ip === PEER)) PEER = (peers.find(p => p.online) || {}).ip || '';
  $('devs').innerHTML = peers.length ? peers.map(p => `<button class="dev${p.ip === PEER ? ' on' : ''}${p.online ? '' : ' off'}" data-ip="${esc(p.ip)}">
      <b>${esc(p.name || p.ip)}</b><small>${p.online ? (p.battery ? `🔋 ${p.battery.level}%${p.battery.charging ? ' ⚡' : ''}` : L('в сети', 'online')) : L('не в сети', 'offline')}</small></button>`).join('')
    : `<div class="hint">${esc(ST.devnet === 'off' ? L('Включи сеть устройств — через неё устройства видят друг друга.', 'Turn on the device network.') : L('Других устройств в сети пока нет.', 'No other devices yet.'))}</div>`;
  $('devs').querySelectorAll('[data-ip]').forEach(b => b.onclick = () => { PEER = b.dataset.ip; load(); });
  const n = ST.notifs || [];
  $('nots').innerHTML = n.length ? n.slice(0, 50).map(x => `<div class="n"><div class="h"><span>${esc(x.from || '')}</span><span>${esc(x.app || '')}</span><span>${new Date(x.time * 1000).toLocaleTimeString(LANG === 'en' ? 'en-GB' : 'ru-RU', {hour: '2-digit', minute: '2-digit'})}</span></div>
      <b>${esc(x.title || '')}</b>${esc(x.text || '')}</div>`).join('') + `<button class="btn" id="clr" style="margin-top:8px">${esc(L('Очистить', 'Clear'))}</button>`
    : `<div class="hint">${esc(L('Уведомлений с телефона пока нет. На телефоне добавь этот плагин и дай «Доступ к уведомлениям».', 'No notifications yet. On the phone add this plugin and grant notification access.'))}</div>`;
  if($('clr')) $('clr').onclick = async () => { await api('/api/phonelink', {op: 'clear'}); load(); };
  $('sSend').checked = ST.settings.sendNotifs; $('sCtl').checked = ST.settings.allowControl;
  $('rowSend').hidden = !ANDROID;
  if(ANDROID && window.SSHTunnelAndroid.notifAccess){
    const ok = SSHTunnelAndroid.notifAccess();
    $('access').innerHTML = ok ? `<span class="hint ok">✓ ${esc(L('Доступ к уведомлениям дан', 'Notification access granted'))}</span>`
      : `<button class="btn primary" id="acc">${esc(L('Дать доступ к уведомлениям', 'Grant notification access'))}</button>`;
    if($('acc')) $('acc').onclick = () => SSHTunnelAndroid.openNotifAccess();
  }
}
const saveSet = () => api('/api/phonelink', {op: 'set', settings: {sendNotifs: $('sSend').checked, allowControl: $('sCtl').checked}});
$('sSend').onchange = saveSet; $('sCtl').onchange = saveSet;

// Тачпад: ведёшь пальцем — курсор едет (ускорение на быстрых движениях),
// тап — щелчок, два пальца вверх-вниз — прокрутка.
(() => {
  const pad = $('pad');
  let last = null, moved = 0, acc = {x: 0, y: 0}, timer = 0, two = null, t0 = 0;
  const flush = () => { timer = 0; const dx = Math.round(acc.x), dy = Math.round(acc.y); if(!dx && !dy) return; acc = {x: 0, y: 0}; act('mouse', {dx, dy}); };
  pad.addEventListener('pointerdown', e => { pad.setPointerCapture(e.pointerId); last = {x: e.clientX, y: e.clientY}; moved = 0; t0 = Date.now(); });
  pad.addEventListener('pointermove', e => {
    if(!last || two) return;
    const dx = e.clientX - last.x, dy = e.clientY - last.y; last = {x: e.clientX, y: e.clientY};
    const k = Math.min(4, 1.2 + Math.hypot(dx, dy) / 8);
    acc.x += dx * k; acc.y += dy * k; moved += Math.abs(dx) + Math.abs(dy);
    if(!timer) timer = setTimeout(flush, 33);
  });
  pad.addEventListener('pointerup', () => { if(last && moved < 6 && Date.now() - t0 < 300) act('mouse', {btn: 'left'}); last = null; });
  pad.addEventListener('touchstart', e => { if(e.touches.length === 2) two = e.touches[0].clientY; }, {passive: true});
  pad.addEventListener('touchmove', e => {
    if(two === null || e.touches.length !== 2) return;
    const d = e.touches[0].clientY - two;
    if(Math.abs(d) > 24){ act('mouse', {scroll: d > 0 ? 1 : -1}); two = e.touches[0].clientY; }
  }, {passive: true});
  pad.addEventListener('touchend', () => { two = null; });
  pad.addEventListener('wheel', e => { e.preventDefault(); act('mouse', {scroll: e.deltaY < 0 ? 1 : -1}); }, {passive: false});
})();

$('tFind').textContent = L('Найти устройство', 'Find device');
$('ring').textContent = L('📢 Позвонить', '📢 Ring');
$('ring').onclick = () => act('ring');
$('hFind').textContent = L('Телефон зазвонит на полную громкость 20 секунд — даже в беззвучном. ПК — сигнал и уведомление.', 'The phone rings at full volume for 20 s even if silenced. A PC beeps and notifies.');
$('tMedia').textContent = L('Музыка и громкость', 'Music and volume');
document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => act('media', {key: b.dataset.k}));
$('tPad').textContent = L('Тачпад и клавиатура (для ПК)', 'Touchpad and keyboard (for a PC)');
$('pad').textContent = L('Веди пальцем — курсор, тап — щелчок, двумя пальцами — прокрутка', 'Move — cursor, tap — click, two fingers — scroll');
$('lc').textContent = L('Левая', 'Left'); $('rc').textContent = L('Правая', 'Right');
$('lc').onclick = () => act('mouse', {btn: 'left'}); $('rc').onclick = () => act('mouse', {btn: 'right'});
$('txt').placeholder = L('напечатать на устройстве…', 'type on the device…');
$('send').textContent = L('Отправить', 'Send');
$('send').onclick = async () => { const t = $('txt').value; if(!t) return; const r = await act('text', {text: t}); if(r && !r.error) $('txt').value = ''; };
$('txt').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); $('send').click(); } });
$('tNot').textContent = L('Уведомления с других устройств', 'Notifications from other devices');
$('tSet').textContent = L('Это устройство', 'This device');
$('lSend').textContent = L('Пересылать мои уведомления на свои устройства', 'Send my notifications to my devices');
$('lCtl').textContent = L('Разрешить своим устройствам управлять этим (мышь, клавиатура, музыка)', 'Let my devices control this one (mouse, keyboard, music)');
load();
setInterval(() => { if(!document.hidden) load(); }, 5000);
</script>
</body>
</html>
