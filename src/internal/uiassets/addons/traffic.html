<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расход трафика</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../pages.css">
<style>
  body{background:transparent}
  .wrap{display:flex;flex-direction:column;gap:12px;padding:0 14px 16px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:12px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:0;background:transparent;color:var(--dim);padding:6px 12px;cursor:pointer;font:inherit}
  .seg button.on{background:var(--accent-muted);color:#fff}
  .tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
  .tot .card{display:flex;flex-direction:column;gap:2px;padding:10px 12px}
  .tot .k{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
  .tot .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
  #barInfo{margin-top:6px}
  .chart text.sum{font-size:10px;fill:var(--text)}
  #barInfo .dot{margin:0 4px 0 6px;vertical-align:-1px}
  .chart .hit{cursor:pointer}
  .c-server{background:var(--accent)} .c-direct{background:var(--ok)} .c-mesh{background:var(--warn)}
  svg.chart{display:block;width:100%;height:190px}
  svg.chart text{font-size:10px;fill:var(--dim);font-variant-numeric:tabular-nums}
  svg.chart .grid{stroke:var(--line);stroke-width:1}
  .prog .why{display:block;color:var(--dim);font-size:11.5px;font-weight:400}
  .r-server{fill:var(--accent)} .r-direct{fill:var(--ok)} .r-mesh{fill:var(--warn)}
  .prog{display:grid;grid-template-columns:26px 1fr auto;gap:4px 10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
  .prog:last-child{border-bottom:0}
  .prog .ic{width:26px;height:26px;border-radius:7px;background:var(--card2);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .prog .ic img{width:100%;height:100%;object-fit:contain}
  .prog .ic .mi{width:16px;height:16px;color:var(--dim)}
  .prog .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prog .s{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;text-align:right}
  .prog .line{grid-column:2/4;display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--card2)}
  .prog .line i{display:block;height:100%}
  .lim{display:flex;flex-direction:column;gap:10px}
  .lim .f{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  select,input{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
  input[type=number]{width:90px}
  .meter{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
  .meter i{display:block;height:100%;background:var(--accent)}
  .meter.w i{background:var(--warn)} .meter.e i{background:var(--err)}
  h3{margin:4px 0 0;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="seg" id="per"></div>
    <div class="seg" id="net" hidden></div>
  </div>
  <div class="tot" id="tot"></div>
  <div class="card"><svg class="chart" id="chart"></svg>
    <div class="hint" id="barInfo"></div></div>
  <h3 id="topT"></h3>
  <div class="card" id="top"></div>
  <div class="card lim" id="lim"></div>
  <div class="hint" id="note"></div>
</div>
<script src="../pages.js"></script>
<script>
let PER = 'week', NET = 'all', DATA = null, LABELS = {};
const COLORS = ['server', 'direct', 'mesh'];
const NAMES = {server: L('Через VPN', 'Via VPN'), direct: L('Напрямую', 'Direct'), mesh: L('Сеть устройств', 'Device network')};

function human(b){
  if(b >= 1e9) return (b / 1e9).toFixed(b >= 1e10 ? 1 : 2) + L(' ГБ', ' GB');
  if(b >= 1e6) return (b / 1e6).toFixed(b >= 1e8 ? 0 : 1) + L(' МБ', ' MB');
  if(b >= 1e3) return Math.round(b / 1e3) + L(' КБ', ' KB');
  return Math.round(b) + L(' Б', ' B');
}

function seg(id, items, cur, set){
  $(id).innerHTML = items.map(([v, t]) => `<button data-v="${v}" class="${v === cur ? 'on' : ''}">${esc(t)}</button>`).join('');
  $(id).querySelectorAll('button').forEach(b => b.onclick = () => { set(b.dataset.v); load(); });
}

function progName(n){
  if(!n) return L('Без программы (система)', 'No app (system)');
  if(n === 'ssh_tunnel') return L('ssh_tunnel (календарь, SSH, файлы)', 'ssh_tunnel (calendar, SSH, files)');
  return LABELS[n] || n;
}
// Что за системные программы — чтобы было понятно, кто «жрёт».
const KNOWN = {
  'svchost.exe': L('службы Windows: обновления, Microsoft Store, синхронизация, время', 'Windows services: updates, Microsoft Store, sync, time'),
  'msedgewebview2.exe': L('встроенный браузер: окна программ, в т.ч. окна ssh_tunnel', 'built-in browser: app windows, incl. ssh_tunnel windows'),
  'system': L('ядро Windows', 'Windows kernel'),
  'lsass.exe': L('вход и сертификаты Windows', 'Windows sign-in and certificates'),
  'backgroundtaskhost.exe': L('фоновые задачи приложений Windows', 'Windows app background tasks'),
};

// niceMax — верх шкалы: 1, 2 или 5 × 10ⁿ, не меньше 1 КБ (пустой график
// не подписывается дробями байтов).
function niceMax(v){
  v = Math.max(v, 1000);
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for(const m of [1, 2, 2.5, 5, 10]) if(v <= m * p) return m * p;
  return 10 * p;
}

function drawChart(days){
  // Ширина — настоящая, чтобы подписи не растягивались. Подписи шкалы — слева,
  // в своей колонке: столбики их не закрывают.
  const W = Math.max(240, $('chart').clientWidth || 600), H = 190, top = 10, bot = 22, left = 58;
  $('chart').setAttribute('viewBox', `0 0 ${W} ${H}`);
  const max = niceMax(Math.max(0, ...days.map(d => d.server + d.direct + d.mesh)));
  const n = Math.max(1, days.length), slot = (W - left) / n;
  const gap = n > 14 ? 2 : 6, bw = Math.min(48, slot - gap);
  let s = '';
  for(let i = 0; i <= 4; i++){
    const y = top + (H - top - bot) * (1 - i / 4);
    s += `<line class="grid" x1="${left}" x2="${W}" y1="${y}" y2="${y}"/><text x="${left - 6}" y="${y + 3}" text-anchor="end">${esc(i ? human(max * i / 4) : '0')}</text>`;
  }
  days.forEach((d, i) => {
    const x = left + i * slot + (slot - bw) / 2;
    let y = H - bot;
    for(const k of COLORS){
      const h = (H - top - bot) * d[k] / max;
      if(h > 0){ y -= h; s += `<rect class="r-${k}" x="${x}" y="${y}" width="${bw}" height="${h}" rx="2"><title>${esc(barLabel(d))} — ${esc(NAMES[k])}: ${esc(human(d[k]))}</title></rect>`; }
    }
    // Прозрачная полоса на весь столбик — по нажатию строка под графиком
    // («13:00 — через VPN 120 МБ · напрямую 5 МБ»): на телефоне подсказок нет.
    s += `<rect class="hit" data-i="${i}" x="${left + i * slot}" y="${top}" width="${slot}" height="${H - top - bot}" fill="transparent"/>`;
    // Сколько всего — прямо над столбиком, если влезает подпись.
    const sum = COLORS.reduce((a, k) => a + d[k], 0);
    if(sum > 0 && slot >= 34) s += `<text class="sum" x="${x + bw / 2}" y="${Math.max(top + 8, y - 3)}" text-anchor="middle">${esc(human(sum))}</text>`;
    const step = n > 14 ? (n === 24 ? 3 : 5) : 1;
    if(i % step === 0 || (n !== 24 && i === n - 1))
      s += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${esc(barLabel(d, true))}</text>`;
  });
  $('chart').innerHTML = s;
  $('chart').querySelectorAll('.hit').forEach(el => el.onclick = () => barInfo(days[+el.dataset.i]));
  // Расход видно сразу: строка под графиком — по последнему столбику с
  // трафиком (текущий час или день); нажатие на другой — покажет его.
  let last = null;
  for(const d of days) if(COLORS.some(k => d[k] > 0)) last = d;
  barInfo(last);
}
// barLabel — подпись столбика: час («13:00», коротко «13») или день («04.11»).
function barLabel(d, short){
  if(d.date.includes(':')) return short ? d.date.slice(0, 2) : d.date;
  return d.date.slice(8) + '.' + d.date.slice(5, 7);
}
function barInfo(d){
  const box = $('barInfo');
  if(!d){ box.textContent = L('Трафика пока не было.', 'No traffic yet.'); return; }
  const parts = COLORS.filter(k => d[k] > 0).map(k => `<i class="dot c-${k}"></i>${esc(NAMES[k])} ${esc(human(d[k]))}`);
  box.innerHTML = `<b>${esc(barLabel(d))}</b> — ${parts.length ? parts.join(' · ') : esc(L('ничего', 'nothing'))}`;
}

function render(){
  const r = DATA;
  if(!r) return;
  if(r.error){ $('note').textContent = r.error; return; }
  seg('per', [['day', L('День', 'Day')], ['week', L('Неделя', 'Week')], ['month', L('Месяц', 'Month')]], PER, v => PER = v);
  if(r.hasNet){
    $('net').hidden = false;
    seg('net', [['all', L('Все сети', 'All')], ['wifi', 'Wi-Fi'], ['mobile', L('Мобильная', 'Mobile')]], NET, v => NET = v);
  }
  const t = r.total, sum = t.server + t.direct + t.mesh;
  $('tot').innerHTML = [[L('Всего', 'Total'), sum, '']].concat(COLORS.map(k => [NAMES[k], t[k], k]))
    .map(([n, v, k]) => `<div class="card"><span class="k">${k ? `<i class="dot c-${k}"></i>` : ''}${esc(n)}</span><span class="v">${esc(human(v))}</span></div>`).join('');
  drawChart(chartData(r));
  $('topT').textContent = L('Программы', 'Apps');
  $('top').innerHTML = r.top.length ? r.top.map(p => {
    const w = k => (p.total ? p[k] * 100 / p.total : 0).toFixed(1);
    const ic = ANDROID && p.name && p.name !== 'ssh_tunnel' && !p.name.startsWith('uid:')
      ? `<img src="/api/appicon?pkg=${encodeURIComponent(p.name)}&t=${encodeURIComponent(T)}" alt="" onerror="this.remove()">` : icon('apps');
    return `<div class="prog"><span class="ic">${ic}</span><span class="n" title="${esc(p.name)}">${esc(progName(p.name))}${KNOWN[(p.name || '').toLowerCase()] ? `<small class="why">${esc(KNOWN[p.name.toLowerCase()])}</small>` : ''}</span>
      <span class="s">${esc(human(p.total))}</span>
      <span class="line">${COLORS.map(k => `<i class="c-${k}" style="width:${w(k)}%" title="${esc(NAMES[k])}: ${esc(human(p[k]))}"></i>`).join('')}</span></div>`;
  }).join('') : `<div class="hint">${L('Пока ничего не прошло.', 'Nothing yet.')}</div>`;
  drawLimit(r.limit, r.hasNet);
  $('note').textContent = L('Считается то, что проходит через ssh_tunnel; хранятся 3 месяца. Исключённые приложения на телефоне идут мимо и не считаются.',
    'Counts what goes through ssh_tunnel; kept for 3 months. Apps excluded on the phone bypass it and are not counted.');
}

function drawLimit(l, hasNet){
  const pct = Math.min(100, l.pct || 0);
  const cls = l.pct >= 100 ? 'e' : l.pct >= 80 ? 'w' : '';
  $('lim').innerHTML = `
    <label class="f"><input type="checkbox" id="lOn" ${l.on ? 'checked' : ''}> ${L('Предупреждать о расходе', 'Warn about usage')}</label>
    <div class="f" id="lF" ${l.on ? '' : 'hidden'}>
      <input type="number" id="lGB" min="0.1" step="0.1" value="${l.gb}"> ${L('ГБ', 'GB')}
      <select id="lPer"><option value="month">${L('в месяц', 'per month')}</option><option value="day">${L('в день', 'per day')}</option></select>
      <select id="lSc"><option value="all">${L('весь трафик', 'all traffic')}</option><option value="server">${L('только через VPN', 'VPN only')}</option>
        ${hasNet ? `<option value="mobile">${L('только мобильная сеть', 'mobile data only')}</option>` : ''}</select>
    </div>
    <div ${l.on ? '' : 'hidden'}><div class="meter ${cls}"><i style="width:${pct}%"></i></div>
      <div class="hint" style="margin-top:6px">${esc(human(l.used))} ${L('из', 'of')} ${esc(human(l.gb * 1e9))} (${l.pct || 0}%). ${L('На 80% и 100% придёт предупреждение; VPN не выключится.', 'You get a warning at 80% and 100%; VPN keeps working.')}</div></div>`;
  $('lPer').value = l.period; $('lSc').value = l.scope;
  const save = () => api('/api/traffic/limit?period=' + PER + '&net=' + NET,
    {on: $('lOn').checked, gb: parseFloat($('lGB').value) || 0, period: $('lPer').value, scope: $('lSc').value}).then(r => { DATA = r; render(); });
  $('lOn').onchange = save; $('lGB').onchange = save; $('lPer').onchange = save; $('lSc').onchange = save;
}

async function load(){
  try { DATA = await api('/api/traffic?period=' + PER + '&net=' + NET); } catch(e) { DATA = {error: String(e)}; }
  // Не перерисовывать, пока человек правит лимит.
  if(document.activeElement && $('lim').contains(document.activeElement)) return;
  render();
}

if(ANDROID) api('/api/processes').then(list => { for(const p of list || []) LABELS[p.name] = p.label; render(); }).catch(() => {});
load();
setInterval(load, 10000);
// chartData — «День» рисуется по часам, неделя и месяц — по дням.
function chartData(r){ return PER === 'day' && r.hours && r.hours.length ? r.hours : r.days; }
window.addEventListener('resize', () => DATA && !DATA.error && drawChart(chartData(DATA)));
</script>
</body>
</html>
