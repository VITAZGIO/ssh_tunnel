<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Блокировка рекламы</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../pages.css">
<style>
  body{background:transparent}
  .wrap{display:flex;flex-direction:column;gap:10px;padding:12px 14px 16px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:0;background:transparent;color:var(--dim);padding:7px 13px;cursor:pointer;font:inherit}
  .seg button.on{background:var(--accent-muted);color:#fff}
  .tab[hidden]{display:none}
  /* Вкладки «Статистика / Списки» — пополам на всю ширину. */
  #tabs{display:flex}
  #tabs button{flex:1}
  .tab{display:flex;flex-direction:column;gap:10px}
  .sw{display:flex;align-items:center;gap:12px}
  .sw b{font-size:16px}
  .sw .st{color:var(--dim);font-size:13px}
  .sw .st.on{color:var(--ok)}
  .tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tot .card{padding:10px 12px}
  .tot .k{color:var(--dim);font-size:12px}
  .tot .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .chart{width:100%;height:150px;display:block}
  .chart text{fill:var(--dim);font-size:10px}
  .chart rect{fill:var(--accent)}
  .chart rect.today{fill:var(--ok)}
  .row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .row:last-child{border-bottom:0}
  .row .n{font-family:var(--mono);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .c{color:var(--dim);font-variant-numeric:tabular-nums}
  .row .bar{height:4px;border-radius:2px;background:var(--accent);opacity:.6;grid-column:1/-1;margin-top:-4px}
  .row button{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:7px;padding:3px 8px;cursor:pointer;font:inherit;font-size:12px}
  .row button:hover{color:var(--text);border-color:var(--accent)}
  h3{margin:4px 0 0;font-size:14px}
  textarea{width:100%;box-sizing:border-box;min-height:140px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);font:13px var(--mono);resize:vertical}
  .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .ok{color:var(--ok)}.err{color:var(--err)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card sw">
    <label class="ck" style="display:flex;gap:10px;align-items:center;cursor:pointer"><input type="checkbox" id="on"><b id="onT"></b></label>
    <span class="st" id="onS"></span>
  </div>
  <div class="card" id="noVpn" hidden></div>
  <div class="seg" id="tabs"></div>

  <!-- Статистика: сколько и чего отсечено. -->
  <div class="tab" id="tStat">
    <div class="tot" id="tot"></div>
    <div class="card"><svg class="chart" id="chart"></svg></div>
    <div class="acts"><h3 id="topT"></h3><span class="sp" style="flex:1"></span><div class="seg" id="per"></div></div>
    <div class="card" id="top"></div>
    <h3 id="recT"></h3>
    <div class="card" id="rec"></div>
  </div>

  <!-- Списки: что блокировать и что пропускать. -->
  <div class="tab" id="tLists" hidden>
    <div class="hint" id="srcH"></div>
    <textarea id="src" spellcheck="false"></textarea>
    <div class="hint" id="allowH"></div>
    <textarea id="allow" spellcheck="false"></textarea>
    <div class="acts"><button class="btn primary" id="save"></button><span class="hint" id="note"></span></div>
  </div>
</div>
<script src="../pages.js"></script>
<script>
/* Блокировка рекламы и слежки — плагин. Блокирует слой VPN (на телефоне и
   в VPN-версии на Windows/Linux): имя из списка не получает адреса. Здесь —
   включить, списки и статистика (/api/adblock/stats). Настройки — те же
   поля adBlock* в /api/config, что раньше были в «Настройках». */
let TAB = 'stat', PER = 'today', ST = null, CFG = null;
const fmt = n => n >= 10000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1) + L(' тыс.', 'k') : String(n);

function tabs(){
  $('tabs').innerHTML = [['stat', L('Статистика', 'Statistics')], ['lists', L('Списки', 'Lists')]]
    .map(([v, t]) => `<button data-v="${v}" class="${v === TAB ? 'on' : ''}">${esc(t)}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { TAB = b.dataset.v; tabs(); });
  $('tStat').hidden = TAB !== 'stat'; $('tLists').hidden = TAB !== 'lists';
  $('per').innerHTML = [['today', L('сегодня', 'today')], ['week', L('7 дней', '7 days')]]
    .map(([v, t]) => `<button data-v="${v}" class="${v === PER ? 'on' : ''}">${esc(t)}</button>`).join('');
  $('per').querySelectorAll('button').forEach(b => b.onclick = () => { PER = b.dataset.v; tabs(); drawStats(); });
}

async function load(){
  const [st, cfg, stats] = await Promise.all([api('/api/status').catch(() => ({})), api('/api/config').catch(() => ({})), api('/api/adblock/stats').catch(() => null)]);
  CFG = cfg || {};
  const vpn = !!(st && st.adBlock);
  $('noVpn').hidden = vpn;
  $('noVpn').textContent = L('Блокировка работает в режиме VPN: на телефоне и в VPN-версии ssh_tunnel на Windows и Linux. В обычной версии имена разрешают сами программы — перехватить нечего.',
    'Blocking works in VPN mode: on the phone and in the VPN build on Windows and Linux. In the regular build programs resolve names themselves.');
  $('on').checked = !!CFG.adBlockEnabled; $('on').disabled = !vpn;
  $('onS').textContent = CFG.adBlockEnabled ? L('работает', 'on') : L('выключена', 'off');
  $('onS').className = 'st' + (CFG.adBlockEnabled ? ' on' : '');
  if(document.activeElement !== $('src')) $('src').value = CFG.adBlockSources || '';
  if(document.activeElement !== $('allow')) $('allow').value = CFG.adBlockAllowlist || '';
  ST = stats && !stats.error ? stats : null;
  drawStats();
}

function drawStats(){
  const s = ST || {days: [], today: 0, week: 0, month: 0, topToday: [], topWeek: [], recent: []};
  $('tot').innerHTML = [[L('Сегодня', 'Today'), s.today], [L('7 дней', '7 days'), s.week], [L('30 дней', '30 days'), s.month]]
    .map(([k, v]) => `<div class="card"><div class="k">${esc(k)}</div><div class="v">${fmt(v)}</div></div>`).join('');
  // Столбики по дням за 2 недели; сегодня — зелёный.
  const W = Math.max(260, $('chart').clientWidth || 500), H = 150, bot = 18, top = 14;
  const days = s.days || [], max = Math.max(1, ...days.map(d => d.n)), slot = W / Math.max(1, days.length);
  let g = '';
  days.forEach((d, i) => {
    const h = (H - top - bot) * d.n / max, x = i * slot + slot * 0.15, w = slot * 0.7;
    g += `<rect class="${i === days.length - 1 ? 'today' : ''}" x="${x}" y="${H - bot - h}" width="${w}" height="${Math.max(h, d.n ? 2 : 0)}" rx="3"><title>${esc(d.date)}: ${d.n}</title></rect>`;
    if(d.n && slot >= 26) g += `<text x="${x + w / 2}" y="${H - bot - h - 3}" text-anchor="middle">${fmt(d.n)}</text>`;
    if(i % (slot < 30 ? 2 : 1) === 0) g += `<text x="${x + w / 2}" y="${H - 4}" text-anchor="middle">${esc(d.date.slice(8))}.${esc(d.date.slice(5, 7))}</text>`;
  });
  $('chart').setAttribute('viewBox', `0 0 ${W} ${H}`); $('chart').innerHTML = g;

  $('topT').textContent = L('Чаще всего', 'Most blocked');
  const list = (PER === 'today' ? s.topToday : s.topWeek) || [], tmax = Math.max(1, ...list.map(t => t.n));
  $('top').innerHTML = list.length ? list.map(t => `<div class="row"><span class="n" title="${esc(t.name)}">${esc(t.name)}</span><span class="c">${fmt(t.n)}</span>
      <button data-allow="${esc(t.name)}">${esc(L('пропускать', 'allow'))}</button><i class="bar" style="width:${(t.n * 100 / tmax).toFixed(1)}%"></i></div>`).join('')
    : `<div class="hint" style="padding:8px 0">${esc(L('Пока ничего не заблокировано.', 'Nothing blocked yet.'))}</div>`;
  $('recT').textContent = L('Последние', 'Recent');
  $('rec').innerHTML = (s.recent || []).length ? s.recent.slice(0, 40).map(h => `<div class="row"><span class="n">${esc(h.name)}</span>
      <span class="c">${new Date(h.time * 1000).toLocaleTimeString(LANG === 'en' ? 'en-GB' : 'ru-RU')}</span><button data-allow="${esc(h.name)}">${esc(L('пропускать', 'allow'))}</button></div>`).join('')
    : `<div class="hint" style="padding:8px 0">${esc(L('Пусто.', 'Empty.'))}</div>`;
  document.querySelectorAll('[data-allow]').forEach(b => b.onclick = () => allowName(b.dataset.allow));
}

// «Пропускать» — имя в белый список: сайт, который сломался из-за блокировки.
async function allowName(n){
  if(!confirm(L(`Пропускать ${n}? Имя попадёт в белый список.`, `Allow ${n}? It goes to the allow list.`))) return;
  const cur = (CFG.adBlockAllowlist || '').split(/[\s,]+/).filter(Boolean);
  if(!cur.includes(n)) cur.push(n);
  await save({adBlockAllowlist: cur.join('\n')}, false);
}

async function save(doc, lists){
  $('note').className = 'hint'; $('note').textContent = L('Сохраняю…', 'Saving…');
  const r = await api('/api/config', doc).catch(e => ({error: String(e)}));
  if(r && r.error){ $('note').className = 'hint err'; $('note').textContent = r.error; return; }
  // Списки скачиваются по ссылкам заново и сразу применяются.
  if(lists && (doc.adBlockEnabled ?? CFG.adBlockEnabled) && (doc.adBlockSources || '').trim()){
    $('note').textContent = L('Скачиваю списки…', 'Downloading lists…');
    const u = await api('/api/adblock/update', {sources: doc.adBlockSources}).catch(e => ({error: String(e)}));
    $('note').className = 'hint ' + (u.error ? 'err' : 'ok');
    $('note').textContent = u.error || L(`Готово: имён в списке — ${u.count}`, `Done: ${u.count} names in the list`);
  } else { $('note').className = 'hint ok'; $('note').textContent = L('Сохранено', 'Saved'); }
  changed();
  load();
}

$('onT').textContent = L('Блокировать рекламу и слежку', 'Block ads and tracking');
$('on').onchange = () => save({adBlockEnabled: $('on').checked, adBlockSources: $('src').value.trim()}, $('on').checked);
$('srcH').textContent = L('Списки блокировки: ссылки на списки в формате hosts или adblock (по одной в строке) — их скачивает программа. По умолчанию — проверенные списки рекламы и трекеров.',
  'Block lists: links to hosts or adblock-style lists, one per line — the program downloads them.');
$('allowH').textContent = L('Белый список: имена, которые пропускать, даже если они в списках (сломался сайт или приложение — впиши сюда его домен).',
  'Allow list: names to let through even if listed (if a site breaks, add its domain here).');
$('src').placeholder = L('https://… — по одной ссылке в строке', 'https://… — one link per line');
$('allow').placeholder = 'example.com';
$('save').textContent = L('Сохранить и обновить списки', 'Save and update lists');
$('save').onclick = () => save({adBlockSources: $('src').value.trim(), adBlockAllowlist: $('allow').value.trim()}, true);
tabs();
load();
setInterval(() => { if(!document.hidden && TAB === 'stat') load(); }, 10000);
addEventListener('resize', drawStats);
</script>
</body>
</html>
