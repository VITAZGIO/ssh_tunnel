<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зеркальные папки</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../pages.css">
<style>
  body{background:transparent}
  .box{padding:0 14px 16px;display:flex;flex-direction:column;gap:10px}
  .tabs{display:flex;gap:6px;padding-top:10px;flex-wrap:wrap}
  .tabs button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer}
  .tabs button.on{border-color:var(--accent);background:var(--card2)}
  .tabs .ico{margin-left:auto;border:0;background:transparent;padding:7px}
  .tabs .ico.spin svg,.tabs .ico.spin .mi{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--warn);color:#000;font-size:12px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bar .sp{flex:1}
  .btn{display:inline-flex;align-items:center;gap:6px}
  .btn .mi{width:18px;height:18px}
  select,input,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
  textarea{font-family:var(--mono);font-size:12px;width:100%;box-sizing:border-box;min-height:70px}
  .fold{display:flex;gap:10px;align-items:flex-start}
  .fold .tx{flex:1;min-width:0}
  .fold .p{font-family:var(--mono);font-size:12px;color:var(--dim);word-break:break-all}
  /* Подключённая папка: имя и кнопки сверху, путь и состояние — во всю ширину. */
  .sub .p{font-family:var(--mono);font-size:12px;color:var(--dim);word-break:break-all;margin:6px 0 2px}
  .sub .ctl{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .pathRow{display:flex;gap:6px;flex:1;min-width:200px}
  .pathRow input{flex:1;min-width:0}
  .st{font-size:13px}
  .st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.err{color:var(--err)}
  .msg{font-size:13px}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
  .found{border-color:var(--accent)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media (max-width:640px){ .two{grid-template-columns:1fr} }
  .two pre{white-space:pre-wrap;word-break:break-word;font:12px/1.4 var(--mono);margin:0;max-height:320px;overflow:auto;
           background:var(--card2);border-radius:8px;padding:8px}
  .two h4{margin:0 0 4px;font-size:13px}
  .vrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px 2px;font-size:13px}
  .vrow .d{color:var(--dim);font-size:12px;white-space:nowrap}
  .warn{border-color:var(--warn)}
  /* «Доступ к папкам» (ТЗ 18): список устройств слева, карточка справа; на
     узком экране — список, потом карточка во весь экран с «Назад». */
  .acc{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:10px;align-items:start}
  .acc .list{display:flex;flex-direction:column;gap:4px}
  .dev{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);
       border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--text);font:inherit}
  .dev.on{border-color:var(--accent);background:var(--card2)}
  .dev.off{opacity:.55}
  .dev .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dev .n{font-size:12px;color:var(--dim);white-space:nowrap}
  .grp{font-size:12px;color:var(--dim);margin:6px 2px 0}
  .chk{display:flex;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .chk input{width:18px;height:18px;margin:0;flex:none}
  .chk .tx{flex:1;min-width:0}
  .back{display:none}
  @media (max-width:760px){
    .acc{grid-template-columns:1fr}
    #vAcc.card-open .list,#vAcc.card-open .accHead,#vAcc.card-open #accHint{display:none}
    #vAcc:not(.card-open) .devCard{display:none}
    .back{display:inline-flex}
  }
</style>
</head>
<body>
<div class="box">
  <div class="tabs">
    <button id="tabSubs" class="on"></button><button id="tabServe"></button>
    <button id="tabAcc" hidden></button><button id="tabConf"></button><button id="tabTrash"></button>
    <button class="ico" id="reloadAll"></button>
  </div>
  <div class="card warn" id="perm" hidden></div>
  <div class="msg" id="msg"></div>

  <!-- Подключённые папки и найденные серверы. -->
  <div id="vSubs" class="box" style="padding:0">
    <div id="found"></div>
    <div id="subs"><div class="empty" style="padding:20px" id="loading"></div></div>
  </div>

  <!-- Папки, которые раздаёт это устройство. -->
  <div id="vServe" class="box" style="padding:0" hidden>
    <div class="hint" id="serveHint"></div>
    <div id="serve"></div>
    <div class="card"><div class="bar">
      <span class="pathRow"><input id="servePath"><button class="btn" type="button" data-pick="servePath"></button></span>
      <input id="serveName" style="width:160px">
      <button class="btn primary" id="serveAdd"></button>
    </div></div>
  </div>

  <!-- Доступ к папкам: кому из устройств сети что видно (ТЗ 18). -->
  <div id="vAcc" class="box" style="padding:0" hidden>
    <div class="bar accHead"><b id="accTitle"></b><span class="sp"></span><button class="btn" id="accReload"></button></div>
    <div class="hint" id="accHint"></div>
    <div class="card warn" id="accWarn" hidden></div>
    <div class="acc" id="acc"><div class="list" id="accList"></div><div class="devCard" id="accCard"></div></div>
  </div>

  <!-- Конфликты: две версии рядом. -->
  <div id="vConf" class="box" style="padding:0" hidden><div id="conf"></div></div>

  <!-- Версии и корзина сервера (30 дней). -->
  <div id="vTrash" class="box" style="padding:0" hidden>
    <div class="bar"><select id="trashOf"></select><span class="sp"></span><button class="ico" id="trashReload"></button></div>
    <div class="hint" id="trashHint"></div>
    <div id="trash"></div>
  </div>
</div>

<script src="../pages.js"></script>
<script>
/* Зеркальные папки. Всё делает ядро (/api/mirror): страница только
   показывает и шлёт просьбы. */
const set = (id, t) => $(id).textContent = t;
let S = null, TAB = 'subs', CONF_SIG = '';
const MODES = {both: L('отправлять и получать', 'send and receive'), recv: L('только получать', 'receive only'), send: L('только отправлять', 'send only')};

set('tabSubs', L('Папки', 'Folders'));
set('tabServe', L('Раздаю', 'Sharing'));
set('tabTrash', L('Корзина и версии', 'Trash & versions'));
set('tabConf', L('Конфликты', 'Conflicts'));
set('tabAcc', L('Доступ', 'Access'));
set('accTitle', L('Доступ к папкам', 'Folder access'));
$('accReload').innerHTML = icon('refresh') + esc(L('Обновить', 'Refresh'));
set('accHint', L('Новое устройство сети не видит раздаваемых папок, пока ему их не отметят. Нажми устройство и отметь папки — сохраняется сразу.',
  'A new device of the network sees no shared folders until they are ticked for it. Tap a device and tick folders — saved at once.'));
set('loading', L('Загружаю…', 'Loading…'));
$('reloadAll').innerHTML = icon('refresh');
$('reloadAll').title = L('Обновить всё', 'Refresh all');

// Путь как в проводнике телефона: от корня внутренней памяти (/TRASH/…),
// без /storage/emulated/0 — как у Syncthing. Ядро принимает оба вида.
const ROOT = '/storage/emulated/0';
function shortPath(p){
  if(!ANDROID || !p) return p || '';
  return p === ROOT ? '/' : p.startsWith(ROOT + '/') ? p.slice(ROOT.length) : p;
}
set('serveHint', L('Это устройство — сервер папки: лучше то, что всегда включено. У папки один сервер. Другие устройства найдут её сами на вкладке «Папки».',
  'This device is the folder server: best an always-on one. A folder has one server. Other devices find it on the «Folders» tab.'));
set('trashHint', L('Всё, что заменили или удалили, сервер хранит 30 дней. «Вернуть» кладёт версию на место; текущая при этом сама уходит в версии.',
  'Everything replaced or deleted is kept on the server for 30 days. «Restore» puts the version back; the current one goes to versions itself.'));
$('servePath').placeholder = L('полный путь к папке', 'full path to the folder');
$('serveName').placeholder = L('название', 'name');
$('serveAdd').innerHTML = icon('add') + L('Раздавать', 'Share');
$('trashReload').innerHTML = icon('refresh');

let msgT = 0;
// msg — строка над списком; сама гаснет, чтобы старая ошибка не висела красным.
function msg(t, cls){
  const m = $('msg'); m.textContent = t || ''; m.className = 'msg ' + (cls || '');
  clearTimeout(msgT);
  if(t) msgT = setTimeout(() => { m.textContent = ''; }, 10000);
}

// pickFolder — выбрать папку системным окном: на ПК — проводник, на
// телефоне — выбор папки Android. null — отмена или не умеем (тогда пишут путь).
let pickSeq = 0;
const pickWait = {};
const drafts = {}; // «peer|папка» → {path, mode} в карточке «Найден сервер»
window.sshtunnelPicked = (id, path) => { const f = pickWait[id]; delete pickWait[id]; if(f) f(path || null); };
async function pickFolder(){
  if(ANDROID){
    if(!window.SSHTunnelAndroid.pickFolder) return null;
    const id = String(++pickSeq);
    return new Promise(res => { pickWait[id] = res; SSHTunnelAndroid.pickFolder(id); });
  }
  const r = await api('/api/pickfolder', {}).catch(() => null);
  if(r && r.error){ msg(r.error, 'err'); return null; }
  return r && r.path ? r.path : null;
}
function bindPick(root){
  root.querySelectorAll('[data-pick]').forEach(b => {
    b.innerHTML = icon('folder') + esc(L('Обзор', 'Browse'));
    b.title = L('Выбрать папку', 'Choose a folder');
    b.onclick = async () => {
      const inp = b.dataset.pick === '.' ? b.parentNode.querySelector('input') : $(b.dataset.pick);
      const p = await pickFolder();
      if(p){ inp.value = shortPath(p); inp.dispatchEvent(new Event('input')); }
    };
  });
}
bindPick(document);
function tab(t){
  TAB = t;
  for(const [k, b] of [['subs','tabSubs'],['serve','tabServe'],['acc','tabAcc'],['conf','tabConf'],['trash','tabTrash']]) $(b).classList.toggle('on', k === t);
  $('vSubs').hidden = t !== 'subs'; $('vServe').hidden = t !== 'serve'; $('vAcc').hidden = t !== 'acc';
  $('vConf').hidden = t !== 'conf'; $('vTrash').hidden = t !== 'trash';
  if(t === 'trash') loadTrash();
  if(t === 'conf') drawConflicts();
}
$('tabSubs').onclick = () => tab('subs');
$('tabServe').onclick = () => tab('serve');
$('tabConf').onclick = () => tab('conf');
$('tabAcc').onclick = () => { tab('acc'); drawAccess(); };
$('tabTrash').onclick = () => tab('trash');

async function post(body){
  const r = await api('/api/mirror', body);
  if(r.error){ msg(r.error, 'err'); return false; }
  msg(''); draw(r); return true;
}

function when(t){ return t ? new Date(t * 1000).toLocaleString(LANG === 'en' ? 'en-GB' : 'ru-RU') : ''; }

function statusText(st){
  switch(st.state){
    case 'ok': return [L('синхронизировано', 'in sync'), 'ok'];
    case 'conflict': return [L('конфликт', 'conflict') + ` (${st.conflicts.length})`, 'warn'];
    case 'offline': return [L('сервер недоступен', 'server unreachable') + (st.pending ? ` — ${st.pending} ` + L('файлов ждут', 'files waiting') : ''), 'warn'];
    case 'closed': return [L('владелец закрыл доступ к папке — файлы здесь не тронуты', 'the owner closed access to the folder — files here are untouched'), 'warn'];
    case 'error': return [L('ошибка: ', 'error: ') + (st.error || ''), 'err'];
    default: return [(st.pending ? `${st.pending} ` : '') + L('файлов ждут', 'files waiting') + (st.error ? ' — ' + st.error : ''), 'warn'];
  }
}

// allConflicts — конфликты всех папок: и раздаваемых, и подключённых.
function allConflicts(){
  const out = [];
  if(!S) return out;
  for(const f of S.serve) for(const c of f.conflicts) out.push({id: 'hub:' + f.id, name: f.name, c});
  for(const s of S.subs) for(const c of (s.status.conflicts || [])) out.push({id: s.id, name: s.name, c});
  return out;
}

function draw(r){
  S = r;
  if(ANDROID && window.SSHTunnelAndroid.hasAllFiles && !window.SSHTunnelAndroid.hasAllFiles()){
    $('perm').hidden = false;
    $('perm').innerHTML = `<p style="margin:0 0 8px">${esc(L('Чтобы держать папки в памяти телефона (например, хранилище Obsidian), Android должен разрешить программе «Доступ ко всем файлам».', 'To keep folders in phone storage (e.g. an Obsidian vault), Android must give the app «All files access».'))}</p>
      <button class="btn primary" id="permBtn">${esc(L('Разрешить', 'Allow'))}</button>`;
    $('permBtn').onclick = () => window.SSHTunnelAndroid.requestAllFiles();
  } else $('perm').hidden = true;

  $('tabAcc').hidden = !r.serve.length;
  if(!r.serve.length && TAB === 'acc') tab('serve');
  if(TAB === 'acc') drawAccess();

  const n = allConflicts().length;
  $('tabConf').innerHTML = esc(L('Конфликты', 'Conflicts')) + (n ? `<span class="badge">${n}</span>` : '');

  // Найденные серверы: «Найден сервер, подключиться?» Список перерисовывается
  // каждые 5 с — вписанный или выбранный путь и режим держим в drafts, иначе
  // их затирало значением по умолчанию.
  // Пока человек печатает в строке пути — не трогаем её (клавиатура не прячется).
  const fb = $('found');
  const typing = fb.contains(document.activeElement);
  if(!typing) fb.innerHTML = '';
  for(const f of typing ? [] : r.found){
    const free = f.folders.filter(x => !f.joined[x.id]);
    if(!free.length) continue;
    const c = document.createElement('div');
    c.className = 'card found';
    c.innerHTML = `<div class="fold">${icon('dns')}<div class="tx"><b>${esc(L('Найден сервер', 'Server found'))}: ${esc(f.host || f.peer)}</b>
      <div class="hint">${esc(L('Подключить папку? Выбери, где её хранить на этом устройстве.', 'Connect a folder? Choose where to keep it on this device.'))}</div></div></div>`;
    for(const x of free){
      const row = document.createElement('div');
      row.className = 'bar';
      row.style.marginTop = '8px';
      const def = ANDROID ? '/' + x.name : (r.suggest ? r.suggest + (r.platform === 'windows' ? '\\' : '/') : '') + x.name;
      const key = f.peer + '|' + x.id;
      const d = drafts[key] || (drafts[key] = {path: def, mode: Object.keys(MODES)[0]});
      row.innerHTML = `<b style="min-width:110px">${esc(x.name)}</b>
        <span class="pathRow"><input class="jp" value="${esc(d.path)}"><button class="btn" type="button" data-pick="."></button></span>
        <select class="jm">${Object.entries(MODES).map(([k, v]) => `<option value="${k}"${k === d.mode ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select>
        <button class="btn primary">${icon('sync')}${esc(L('Подключить', 'Connect'))}</button>`;
      row.querySelector('.jp').oninput = ev => { d.path = ev.target.value; };
      row.querySelector('.jm').onchange = ev => { d.mode = ev.target.value; };
      // Кнопка «Подключить» — .primary: первая кнопка в строке — «Обзор».
      row.querySelector('button.primary').onclick = async () => {
        if(await post({op: 'join', peer: f.peer, host: f.host, folder: x.id, name: x.name, path: d.path.trim(), mode: d.mode}))
          delete drafts[key];
      };
      c.appendChild(row);
    }
    bindPick(c);
    fb.appendChild(c);
  }

  const sb = $('subs'); sb.innerHTML = '';
  if(!r.subs.length && !fb.children.length){
    sb.innerHTML = `<div class="empty" style="padding:20px">${esc(r.devnet === 'off'
      ? L('Сеть устройств выключена — серверы папок не видно.', 'The device network is off — no folder servers visible.')
      : L('Подключённых папок нет, и серверов в сети пока не найдено. Сервер — устройство, где во вкладке «Раздаю» открыта папка.', 'No connected folders and no servers found yet. A server is a device with a folder on its «Sharing» tab.'))}</div>`;
  }
  for(const s of r.subs){
    const [txt, cls] = statusText(s.status);
    const c = document.createElement('div');
    c.className = 'card sub';
    c.innerHTML = `<div class="fold">${icon('sync')}<div class="tx"><b>${esc(s.name)}</b> · ${esc(s.host || s.peer)}</div>
      <button class="ico" data-a="sync" title="${esc(L('Сверить сейчас', 'Sync now'))}">${icon('refresh')}</button>
      <button class="ico" data-a="leave" title="${esc(L('Отключить (файлы останутся)', 'Disconnect (files stay)'))}">${icon('close')}</button></div>
      <div class="p">${esc(shortPath(s.path))}</div>
      <div class="st ${cls}">${esc(txt)}${s.status.lastOk ? ' · ' + esc(L('сверено ', 'checked ')) + esc(when(s.status.lastOk)) : ''}</div>
      <div class="ctl"><select title="${esc(L('Режим', 'Mode'))}">${Object.entries(MODES).map(([k, v]) => `<option value="${k}"${k === s.mode ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select></div>`;
    c.querySelector('select').onchange = ev => post({op: 'mode', id: s.id, mode: ev.target.value});
    c.querySelector('[data-a=sync]').onclick = () => post({op: 'sync', id: s.id});
    c.querySelector('[data-a=leave]').onclick = () => {
      if(confirm(L(`Отключить «${s.name}»? Файлы на этом устройстве останутся, синхронизация остановится.`, `Disconnect «${s.name}»? Files on this device stay, syncing stops.`)))
        post({op: 'leave', id: s.id});
    };
    sb.appendChild(c);
  }

  const vb = $('serve'); vb.innerHTML = '';
  if(!r.serve.length) vb.innerHTML = `<div class="empty" style="padding:20px">${esc(L('Это устройство ничего не раздаёт.', 'This device shares nothing.'))}</div>`;
  for(const f of r.serve){
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `<div class="fold">${icon('dns')}<div class="tx"><div><b>${esc(f.name)}</b> · ${f.files} ${esc(L('файлов', 'files'))}</div>
        <div class="p">${esc(shortPath(f.path))}</div><div class="hint">${esc(whoHas(f))}</div></div>
      <button class="ico" data-a="ign" title="${esc(L('Исключения', 'Exclusions'))}">${icon('settings')}</button>
      <button class="ico" data-a="off" title="${esc(L('Перестать раздавать', 'Stop sharing'))}">${icon('close')}</button></div>
      <div class="ign" hidden><div class="hint">${esc(L('Свои исключения, шаблон на строку (например *.log или build/). Мусор Obsidian, временные файлы и конфликты Syncthing исключены всегда.', 'Own exclusions, one pattern per line (e.g. *.log or build/). Obsidian workspace, temp files and Syncthing conflicts are always excluded.'))}</div>
        <textarea>${esc((f.ignore || []).join('\n'))}</textarea><button class="btn">${esc(L('Сохранить', 'Save'))}</button></div>`;
    c.querySelector('[data-a=ign]').onclick = () => { const x = c.querySelector('.ign'); x.hidden = !x.hidden; };
    c.querySelector('.ign button').onclick = () => post({op: 'ignore', id: 'hub:' + f.id, list: c.querySelector('textarea').value.split('\n')});
    c.querySelector('[data-a=off]').onclick = () => {
      if(confirm(L(`Перестать раздавать «${f.name}»? Сама папка не тронется; у других устройств синхронизация остановится.`, `Stop sharing «${f.name}»? The folder itself is untouched; other devices stop syncing.`)))
        post({op: 'unserve', id: 'hub:' + f.id});
    };
    vb.appendChild(c);
  }

  const opts = [...r.serve.map(f => ['hub:' + f.id, f.name + ' (' + L('этот сервер', 'this server') + ')']), ...r.subs.map(s => [s.id, s.name + ' (' + (s.host || s.peer) + ')'])];
  const cur = $('trashOf').value;
  $('trashOf').innerHTML = opts.map(([v, t]) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(t)}</option>`).join('');
  // Конфликты перерисовываются, только если список изменился (иначе
  // тексты версий мигали бы каждые 5 с).
  const sig = JSON.stringify(allConflicts());
  if(TAB === 'conf' && sig !== CONF_SIG) drawConflicts();
  CONF_SIG = sig;
}

// ---- Доступ к папкам (ТЗ 18) ----
let SEL = null; // id выбранного устройства
const devName = id => { const d = ((S && S.access && S.access.devices) || []).find(x => x.id === id); return d ? d.name : id; };

// whoHas — строка у раздаваемой папки: каким устройствам она видна.
function whoHas(f){
  if(f.old) return L('Видна всем устройствам сети, как раньше: сеть пока не сообщает id устройств.', 'Visible to every device of the network, as before: the network does not report device ids yet.');
  const ds = f.devices || [];
  if(!ds.length) return L('Не видна ни одному устройству — отметь их во вкладке «Доступ».', 'Visible to no device — tick them on the «Access» tab.');
  return L('Видна: ', 'Visible to: ') + ds.map(devName).join(', ');
}

function drawAccess(){
  if(!S) return;
  const a = S.access || {devices: []};
  const w = $('accWarn');
  w.hidden = !!a.ids;
  if(!a.ids) w.textContent = L('Сеть не сообщает id устройств — обнови meshd на сервере сети. До этого прежние папки видны всем, как раньше, а новые — никому.',
    'The network does not report device ids — update meshd on the network server. Until then old folders stay visible to all, as before, and new ones to nobody.');
  const box = $('accList'); box.innerHTML = '';
  if(!a.devices.length) box.innerHTML = `<div class="empty" style="padding:12px">${esc(L('Других устройств в сети нет. Появилось новое — нажми «Обновить».', 'No other devices in the network. A new one appeared — press Refresh.'))}</div>`;
  let group = null;
  for(const d of a.devices){
    const g = d.server ? 'srv' : 'dev';
    if(g !== group){
      group = g;
      const h = document.createElement('div');
      h.className = 'grp';
      h.textContent = g === 'srv' ? L('Серверы', 'Servers') : L('Устройства', 'Devices');
      box.appendChild(h);
    }
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'dev' + (d.id === SEL ? ' on' : '') + (d.online ? '' : ' off');
    const kind = d.server ? 'dns' : d.platform === 'android' ? 'smartphone' : 'computer';
    const note = d.gone ? L('нет в сети устройств', 'gone from the network') : d.online ? '' : L('не в сети', 'offline');
    b.innerHTML = `${icon(kind)}<span class="tx">${esc(d.name)}${note ? ' · <span class="n">' + esc(note) + '</span>' : ''}</span>
      <span class="n">${d.folders}/${S.serve.length}</span>`;
    b.title = L('папок видно: ', 'folders visible: ') + d.folders;
    b.onclick = () => { SEL = d.id; drawAccess(); };
    box.appendChild(b);
  }
  if(SEL && !a.devices.some(d => d.id === SEL)) SEL = null;
  $('vAcc').classList.toggle('card-open', !!SEL);
  drawDevCard();
}

function drawDevCard(){
  const box = $('accCard');
  const d = SEL && S.access.devices.find(x => x.id === SEL);
  if(!d){ box.innerHTML = `<div class="empty" style="padding:20px">${esc(L('Выбери устройство в списке.', 'Pick a device in the list.'))}</div>`; return; }
  const hint = d.server
    ? L('Сервер сети сам к папкам этого устройства не ходит: галочка пригодится, только если он станет их забирать.', 'The network server does not fetch the folders of this device itself: a tick only matters if it starts to.')
    : L('Отмеченные папки устройство увидит во вкладке «Папки». Снятая галочка останавливает синхронизацию у него; его файлы остаются.', 'Ticked folders appear on its «Folders» tab. Unticking stops syncing there; its files stay.');
  box.innerHTML = `<div class="card"><div class="bar"><button class="btn back" type="button">${icon('arrow_back')}${esc(L('Назад', 'Back'))}</button>
      <b>${esc(d.name)}</b>${d.ip ? ' <span class="hint">' + esc(d.ip) + '</span>' : ''}<span class="sp"></span>
      <button class="btn" data-all="1">${esc(L('Все', 'All'))}</button><button class="btn" data-all="0">${esc(L('Ни одной', 'None'))}</button></div>
    <div class="hint" style="margin:6px 0">${esc(hint)}</div>
    <div class="rows"></div><div class="msg err" data-e></div></div>`;
  box.querySelector('.back').onclick = () => { SEL = null; drawAccess(); };
  const rows = box.querySelector('.rows'), err = box.querySelector('[data-e]');
  for(const f of S.serve){
    const lab = document.createElement('label');
    lab.className = 'chk';
    const on = !f.old && (f.devices || []).includes(d.id);
    lab.innerHTML = `<input type="checkbox"${on ? ' checked' : ''}><span class="tx"><b>${esc(f.name)}</b><div class="p">${esc(shortPath(f.path))}</div>
      ${f.old ? '<div class="hint">' + esc(L('сейчас видна всем (сеть не сообщает id устройств)', 'visible to all now (no device ids from the network)')) + '</div>' : ''}</span>`;
    const cb = lab.querySelector('input');
    // Каждая галочка — свой запрос сразу; не сохранилось — вернуть как было
    // и сказать почему.
    cb.onchange = async () => {
      const want = cb.checked;
      cb.disabled = true; err.textContent = '';
      const r = await api('/api/mirror', {op: 'grant', device: d.id, id: 'hub:' + f.id, on: want}).catch(e => ({error: e.message}));
      cb.disabled = false;
      if(r.error){ cb.checked = !want; err.textContent = L('Не сохранилось: ', 'Not saved: ') + r.error; return; }
      draw(r);
    };
    rows.appendChild(lab);
  }
  for(const b of box.querySelectorAll('[data-all]')) b.onclick = async () => {
    err.textContent = '';
    const r = await api('/api/mirror', {op: 'grant', device: d.id, id: '*', on: b.dataset.all === '1'}).catch(e => ({error: e.message}));
    if(r.error){ err.textContent = L('Не сохранилось: ', 'Not saved: ') + r.error; return; }
    draw(r);
  };
}
$('accReload').onclick = () => refresh(true);

async function text(id, p){
  const r = await fetch(`/api/mirror/file?id=${encodeURIComponent(id)}&p=${encodeURIComponent(p)}&t=${T}`, {headers: {'X-Token': T}});
  return r.ok ? r.text() : L('(не удалось открыть: ', '(cannot open: ') + r.statusText + ')';
}

async function drawConflicts(){
  const box = $('conf');
  const list = allConflicts();
  if(!list.length){ box.innerHTML = `<div class="empty" style="padding:20px">${esc(L('Конфликтов нет.', 'No conflicts.'))}</div>`; return; }
  box.innerHTML = '';
  for(const {id, name, c} of list){
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div><b>${esc(c.orig)}</b> · ${esc(name)}</div>
      <div class="hint">${esc(L('Файл изменили на двух устройствах. Сохранены обе версии; вторая — от', 'The file was changed on two devices. Both versions are kept; the second is from'))} ${esc(c.device)}, ${esc(when(c.time))}.</div>
      <div class="two"><div><h4>${esc(L('Эта (основная)', 'This one (main)'))}</h4><pre>…</pre></div>
        <div><h4>${esc(L('Та', 'That one'))}: ${esc(c.path.split('/').pop())}</h4><pre>…</pre></div></div>
      <div class="bar" style="margin-top:8px">
        <button class="btn" data-k="orig">${esc(L('Оставить эту', 'Keep this'))}</button>
        <button class="btn" data-k="copy">${esc(L('Оставить ту', 'Keep that'))}</button>
        <button class="btn" data-k="both">${esc(L('Оставить обе', 'Keep both'))}</button></div>`;
    const pres = card.querySelectorAll('pre');
    text(id, c.orig).then(t => pres[0].textContent = t);
    text(id, c.path).then(t => pres[1].textContent = t);
    for(const b of card.querySelectorAll('[data-k]')) b.onclick = () => post({op: 'resolve', id, path: c.path, keep: b.dataset.k});
    box.appendChild(card);
  }
}

async function loadTrash(){
  const id = $('trashOf').value, box = $('trash');
  if(!id){ box.innerHTML = `<div class="empty" style="padding:20px">${esc(L('Нет папок.', 'No folders.'))}</div>`; return; }
  const r = await fetch(`/api/mirror/versions?id=${encodeURIComponent(id)}&t=${T}&lang=${LANG}`, {headers: {'X-Token': T}}).then(x => x.json()).catch(e => ({error: e.message}));
  if(r.error){ box.innerHTML = `<div class="msg err">${esc(r.error)}</div>`; return; }
  if(!r.length){ box.innerHTML = `<div class="empty" style="padding:20px">${esc(L('Пусто.', 'Empty.'))}</div>`; return; }
  box.innerHTML = '';
  for(const v of r.slice(0, 300)){
    const row = document.createElement('div');
    row.className = 'vrow';
    row.innerHTML = `<div>${icon(v.deleted ? 'delete' : 'draft')} ${esc(v.path)}<div class="d">${esc(v.deleted ? L('удалён', 'deleted') : L('старая версия', 'old version'))}${v.by ? ' · ' + esc(v.by) : ''}</div></div>
      <span class="d">${esc(when(v.saved))}</span><button class="btn">${esc(L('Вернуть', 'Restore'))}</button>`;
    row.querySelector('button').onclick = async () => { if(await post({op: 'restore', id, blob: v.blob})) { msg(L('Возвращено: ', 'Restored: ') + v.path, 'ok'); loadTrash(); } };
    box.appendChild(row);
  }
}
$('trashOf').onchange = loadTrash;
$('trashReload').onclick = loadTrash;

$('serveAdd').onclick = async () => {
  const path = $('servePath').value.trim();
  if(!path) return;
  if(await post({op: 'serve', path, name: $('serveName').value.trim()})){ $('servePath').value = ''; $('serveName').value = ''; }
};

// refresh — свежий список. Один запрос за раз и не дольше 10 с: ответ,
// который не пришёл, не должен оставлять страницу пустой навсегда.
let busy = false;
async function refresh(force){
  if(busy && !force) return;
  busy = true;
  $('reloadAll').classList.add('spin');
  const r = await Promise.race([api('/api/mirror').catch(() => null), new Promise(res => setTimeout(() => res(null), 10000))]);
  busy = false;
  $('reloadAll').classList.remove('spin');
  if(!r){
    msg(L('Программа не ответила — нажми «Обновить» справа сверху.', 'The app did not answer — tap Refresh at the top right.'), 'err');
    if(!S) set('loading', L('Не загрузилось.', 'Did not load.'));
    return;
  }
  if(r.error){ msg(r.error, 'err'); return; }
  // Не перерисовывать, пока человек что-то вписывает.
  const a = document.activeElement;
  if(!force && a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) return;
  draw(r);
}
$('reloadAll').onclick = async () => {
  msg('');
  await refresh(true);
  if(TAB === 'trash') loadTrash();
  if(TAB === 'conf') drawConflicts();
};
refresh();
setInterval(() => { if(!document.hidden && TAB !== 'trash') refresh(); }, 5000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) refresh(); });
</script>
