<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пароли</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../pages.css">
<style>
  body{background:transparent}
  .wrap{display:flex;flex-direction:column;gap:10px;padding:12px 14px 16px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input,textarea{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);font:inherit;box-sizing:border-box}
  .bar input{flex:1;min-width:140px}
  .btn{display:inline-flex;align-items:center;gap:6px}
  .lock{display:flex;flex-direction:column;gap:10px;max-width:420px;margin:30px auto;text-align:center;align-items:stretch}
  .lock .mi{width:46px;height:46px;color:var(--accent);margin:0 auto}
  .e{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .e:last-child{border-bottom:0}
  .e .av{width:32px;height:32px;border-radius:9px;background:var(--accent-muted);color:#fff;display:grid;place-items:center;font-weight:700;grid-row:1/3}
  .e .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .e .l{color:var(--dim);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .e .acts{grid-row:1/3;grid-column:3;display:flex;gap:4px}
  .f{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .f label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
  .f .full{grid-column:1/-1}
  .pw{display:flex;gap:6px}.pw input{flex:1;font-family:var(--mono)}
  .ok{color:var(--ok)}.err{color:var(--err)}
  .key{font-family:var(--mono);word-break:break-all;background:var(--card2);padding:8px;border-radius:8px}
  ol{margin:6px 0 0;padding-left:20px;font-size:13px;line-height:1.6}
  #dlg[hidden]{display:none}
  #dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px}
  #dlg .card{width:100%;max-width:460px;display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<div class="wrap">
  <div id="lockV" class="lock" hidden>
    <span class="mi" style="--i:url(/icons/lock.svg)"></span>
    <b id="lockT"></b><div class="hint" id="lockH"></div>
    <input type="password" id="m1" autocomplete="off"><input type="password" id="m2" autocomplete="off" hidden>
    <button class="btn primary" id="mGo" style="justify-content:center"></button>
    <div class="hint" id="mNote"></div>
  </div>

  <div id="mainV" hidden style="display:flex;flex-direction:column;gap:10px">
    <div class="bar"><input id="q" type="search"><button class="btn primary" id="add"></button><button class="ico" id="lockBtn"></button></div>
    <div class="card" id="list"></div>
    <div class="bar"><button class="btn" id="sync"></button><span class="hint" id="syncS"></span></div>
    <div class="card" id="fillCard"></div>
  </div>
</div>

<div id="dlg" hidden><div class="card">
  <b id="dT"></b>
  <div class="f">
    <label><span id="ldTitle"></span><input id="dTitle"></label>
    <label><span id="ldSite"></span><input id="dSite" spellcheck="false"></label>
    <label class="full"><span id="ldLogin"></span><input id="dLogin" spellcheck="false" autocomplete="off"></label>
    <label class="full"><span id="ldPass"></span><span class="pw"><input id="dPass" autocomplete="off" spellcheck="false"><button class="btn" id="dGen"></button></span></label>
    <label class="full"><span id="ldNote"></span><textarea id="dNote" rows="2"></textarea></label>
  </div>
  <div class="bar"><button class="btn primary" id="dSave"></button><button class="btn" id="dCopy"></button><span style="flex:1"></span><button class="btn" id="dDel"></button><button class="btn" id="dClose"></button></div>
  <div class="hint" id="dNote2"></div>
</div></div>

<script src="../pages.js"></script>
<script>
/* Пароли. Всё хранится зашифрованным (главный пароль → ключ); пароли
   страница получает по одному (get) — список приходит без них. */
let ST = null, CUR = null;
const call = body => api('/api/vault', body).catch(e => ({error: String(e)}));

async function load(){
  ST = await api('/api/vault').catch(() => null);
  if(!ST) return;
  const locked = !ST.unlocked;
  $('lockV').hidden = !locked; $('mainV').hidden = locked;
  $('mainV').style.display = locked ? 'none' : 'flex';
  if(locked){
    const create = !ST.exists;
    $('lockT').textContent = create ? L('Новое хранилище паролей', 'New password vault') : L('Пароли закрыты', 'Passwords are locked');
    $('lockH').textContent = create ? L('Придумай главный пароль — им открываются все остальные. Его нигде не хранят: забудешь — пароли не открыть. На других своих устройствах открой «Пароли» тем же главным паролем, и записи синхронизируются сами.', 'Pick a master password — it opens all others. It is not stored anywhere. Use the same one on your other devices and entries sync themselves.')
      : L('Главный пароль — тот же на всех своих устройствах.', 'The master password — the same on all your devices.');
    $('m1').placeholder = L('главный пароль', 'master password');
    $('m2').hidden = !create; $('m2').placeholder = L('ещё раз', 'again');
    $('mGo').textContent = create ? L('Создать', 'Create') : L('Открыть', 'Unlock');
    return;
  }
  draw();
  $('syncS').textContent = ST.lastSync ? L('синхронизировано ', 'synced ') + new Date(ST.lastSync * 1000).toLocaleTimeString(LANG === 'en' ? 'en-GB' : 'ru-RU') : '';
  drawFill();
}
function draw(){
  const q = $('q').value.trim().toLowerCase();
  const es = ST.entries.filter(e => !q || [e.title, e.site, e.login].some(v => (v || '').toLowerCase().includes(q)));
  $('list').innerHTML = es.length ? es.map(e => `<div class="e" data-id="${esc(e.id)}"><span class="av">${esc(((e.title || e.site || '?')[0] || '?').toUpperCase())}</span>
      <span class="t">${esc(e.title || e.site)}</span><span class="l">${esc(e.login || '')}${e.site && e.site !== e.title ? ' · ' + esc(e.site) : ''}</span>
      <span class="acts"><button class="btn" data-cp="login">${esc(L('логин', 'login'))}</button><button class="btn" data-cp="pass">${esc(L('пароль', 'pass'))}</button></span></div>`).join('')
    : `<div class="empty" style="padding:20px">${esc(q ? L('Ничего не нашлось.', 'Nothing found.') : L('Паролей пока нет — «Добавить» или просто войди на сайте: расширение и автозаполнение предложат запомнить.', 'No passwords yet.'))}</div>`;
  $('list').querySelectorAll('.e').forEach(row => {
    row.onclick = ev => { if(!ev.target.closest('[data-cp]')) edit(row.dataset.id); };
    row.querySelectorAll('[data-cp]').forEach(b => b.onclick = async () => {
      const e = await call({op: 'get', id: row.dataset.id});
      if(e.error) return;
      const v = b.dataset.cp === 'pass' ? e.pass : e.login;
      try { await navigator.clipboard.writeText(v); b.textContent = '✓'; } catch(_) { if(ANDROID && SSHTunnelAndroid.copyText) SSHTunnelAndroid.copyText(v); b.textContent = '✓'; }
      setTimeout(() => b.textContent = b.dataset.cp === 'pass' ? L('пароль', 'pass') : L('логин', 'login'), 1500);
    });
  });
}
function drawFill(){
  const c = $('fillCard');
  if(ANDROID){
    const on = window.SSHTunnelAndroid.autofillOn && SSHTunnelAndroid.autofillOn();
    c.innerHTML = `<b>${esc(L('Автозаполнение на телефоне', 'Autofill on the phone'))}</b>
      <div class="hint" style="margin:6px 0">${esc(L('В поле логина или пароля любого приложения появится подсказка с твоими логинами. Пароли закрыты — подсказка «открыть» спросит главный пароль. Новый пароль программа предложит запомнить.', 'Your logins appear in login and password fields of any app.'))}</div>
      ${on ? `<span class="hint ok">✓ ${esc(L('Включено (если выбрана служба ssh_tunnel)', 'On (if ssh_tunnel is the selected service)'))}</span> ` : ''}<button class="btn primary" id="af">${esc(L('Выбрать ssh_tunnel для автозаполнения', 'Choose ssh_tunnel for autofill'))}</button>`;
    $('af').onclick = () => SSHTunnelAndroid.openAutofill();
    return;
  }
  const x = ST.ext || {};
  c.innerHTML = `<b>${esc(L('Браузер на ПК (Яндекс Браузер, Chrome, Edge)', 'Browser on the PC'))}</b>
    <ol><li>${esc(L('«Установить расширение» — программа положит его папкой в «Загрузки».', '«Install extension» puts its folder into Downloads.'))}</li>
      <li>${esc(L('В браузере: browser://extensions (в Chrome — chrome://extensions) → включи «Режим разработчика» → «Загрузить распакованное» → эта папка.', 'In the browser: extensions page → Developer mode → Load unpacked → that folder.'))}</li>
      <li>${esc(L('«Новый ключ сопряжения» → скопируй ключ в окно расширения (значок у адресной строки).', '«New pairing key» → paste it into the extension popup.'))}</li></ol>
    <div class="bar" style="margin-top:8px"><button class="btn primary" id="xi">${esc(L('Установить расширение', 'Install extension'))}</button><button class="btn" id="xk">${esc(L('Новый ключ сопряжения', 'New pairing key'))}</button></div>
    <div class="hint" id="xn" style="margin-top:6px">${x.paired ? esc(L('Ключ уже выдан. Новый — и старые расширения перестанут пускаться.', 'A key exists. A new one locks out old extensions.')) : ''}</div>`;
  $('xi').onclick = async () => { const r = await call({op: 'extinstall'}); $('xn').innerHTML = r.error ? `<span class="err">${esc(r.error)}</span>` : esc(L('Готово: ', 'Done: ')) + `<span class="key">${esc(r.dir)}</span>`; };
  $('xk').onclick = async () => { const r = await call({op: 'extkey'}); if(r.key){ $('xn').innerHTML = `<div class="key">${esc(r.key)}</div>`; try { await navigator.clipboard.writeText(r.key); } catch(_) {} } };
}

$('mGo').onclick = async () => {
  const create = !ST.exists;
  if(create && $('m1').value !== $('m2').value){ $('mNote').className = 'hint err'; $('mNote').textContent = L('Пароли не совпадают.', 'Passwords differ.'); return; }
  $('mNote').className = 'hint'; $('mNote').textContent = L('Открываю…', 'Unlocking…');
  const r = await call({op: create ? 'create' : 'unlock', master: $('m1').value});
  if(r.error){ $('mNote').className = 'hint err'; $('mNote').textContent = r.error; return; }
  $('m1').value = $('m2').value = ''; $('mNote').textContent = '';
  load();
};
$('m1').addEventListener('keydown', e => { if(e.key === 'Enter' && $('m2').hidden) $('mGo').click(); });
$('m2').addEventListener('keydown', e => { if(e.key === 'Enter') $('mGo').click(); });
$('lockBtn').innerHTML = icon('lock'); $('lockBtn').title = L('Закрыть пароли', 'Lock');
$('lockBtn').onclick = async () => { await call({op: 'lock'}); load(); };
$('q').placeholder = L('поиск', 'search'); $('q').oninput = draw;
$('add').innerHTML = icon('add') + esc(L('Добавить', 'Add'));
$('add').onclick = () => edit(null);
$('sync').innerHTML = icon('sync') + esc(L('Синхронизировать', 'Sync'));
$('sync').onclick = async () => { $('syncS').textContent = L('синхронизирую…', 'syncing…'); const r = await call({op: 'sync'});
  $('syncS').textContent = r.error || L(`устройств: ${r.devices}, изменений: ${r.changed}`, `devices: ${r.devices}, changes: ${r.changed}`); load(); };

async function edit(id){
  CUR = id;
  let e = {title: '', site: '', login: '', pass: '', note: ''};
  if(id){ const r = await call({op: 'get', id}); if(r.error) return; e = r; }
  $('dT').textContent = id ? L('Запись', 'Entry') : L('Новая запись', 'New entry');
  $('dTitle').value = e.title || ''; $('dSite').value = e.site || ''; $('dLogin').value = e.login || ''; $('dPass').value = e.pass || ''; $('dNote').value = e.note || '';
  $('dDel').hidden = !id; $('dNote2').textContent = '';
  $('dlg').hidden = false;
}
$('ldTitle').textContent = L('Название', 'Title'); $('ldSite').textContent = L('Сайт или приложение', 'Site or app');
$('dSite').placeholder = 'example.com';
$('ldLogin').textContent = L('Логин', 'Login'); $('ldPass').textContent = L('Пароль', 'Password'); $('ldNote').textContent = L('Заметка', 'Note');
$('dGen').textContent = L('Придумать', 'Generate');
$('dGen').onclick = async () => { const r = await call({op: 'gen', len: 18}); if(r.pass) $('dPass').value = r.pass; };
$('dSave').textContent = L('Сохранить', 'Save'); $('dCopy').textContent = L('Копировать пароль', 'Copy password');
$('dDel').textContent = L('Удалить', 'Delete'); $('dClose').textContent = L('Закрыть', 'Close');
$('dClose').onclick = () => { $('dlg').hidden = true; };
$('dCopy').onclick = async () => { try { await navigator.clipboard.writeText($('dPass').value); $('dNote2').textContent = L('Скопировано', 'Copied'); } catch(_) {} };
$('dSave').onclick = async () => {
  const r = await call({op: 'set', id: CUR || '', title: $('dTitle').value.trim(), site: $('dSite').value.trim(), login: $('dLogin').value.trim(), pass: $('dPass').value, note: $('dNote').value});
  if(r.error){ $('dNote2').className = 'hint err'; $('dNote2').textContent = r.error; return; }
  $('dlg').hidden = true; load();
};
$('dDel').onclick = async () => {
  if(!confirm(L('Удалить запись на всех своих устройствах?', 'Delete on all your devices?'))) return;
  await call({op: 'delete', id: CUR}); $('dlg').hidden = true; load();
};
load();
</script>
</body>
</html>
