<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта сети</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../pages.css">
<style>
  body{background:transparent}
  .wrap{display:flex;flex-direction:column;gap:10px;padding:0 14px 14px;height:100%}
  .map{position:relative;flex:1;min-height:320px;border:1px solid var(--line);border-radius:12px;overflow:hidden;
       background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 65%), var(--card2)}
  .map svg{display:block;width:100%;height:100%}
  /* Как в панели главного сервера: пунктир — через сервер, сплошная — напрямую. */
  .edge{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round}
  .edge.srv{stroke-dasharray:6 7;animation:flow 1.1s linear infinite;opacity:.8}
  .edge.p2p{stroke:var(--ok);stroke-width:2.6}
  @keyframes flow{to{stroke-dashoffset:-26}}
  .lbl{font-size:11px;font-weight:700;fill:var(--text);text-anchor:middle;dominant-baseline:central;
       paint-order:stroke;stroke:var(--card2);stroke-width:4px;font-variant-numeric:tabular-nums}
  .node{cursor:pointer}
  .node .disc{fill:var(--card);stroke:var(--accent);stroke-width:1.6}
  .node.server .disc{stroke-width:2.6}
  .node.self .disc{stroke:var(--ok)}
  .node.off{cursor:pointer}
  .node.off .disc{stroke:var(--dim);opacity:.55}
  .node.off .nm,.node.off .sub{fill:var(--dim)}
  .node .nm{font-size:12px;font-weight:600;fill:var(--text);text-anchor:middle}
  .node .sub{font-size:10.5px;fill:var(--dim);text-anchor:middle}
  .node.sel .disc{stroke-width:3.2}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);align-items:center}
  .legend i{display:inline-block;width:26px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-right:6px}
  .legend i.d{border-top:2.6px solid var(--ok)}
  .legend i.s{border-top-style:dashed}
  .legend i.o{border-top-color:var(--dim)}
  .sheet{position:absolute;left:12px;right:12px;bottom:12px;max-width:380px;margin:0 auto;
         box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .sheet .top{display:flex;align-items:center;gap:10px}
  .sheet .top .mi{width:28px;height:28px;color:var(--accent)}
  .sheet .n{font-weight:600;font-size:15px}
  .sheet .h{color:var(--dim);font-size:12px}
  .sheet dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0;font-size:13px}
  .sheet dt{color:var(--dim)}
  .sheet dd{margin:0;font-family:var(--mono);word-break:break-all}
  .sheet .acts{display:flex;gap:8px;flex-wrap:wrap}
  .sheet .acts .btn{display:inline-flex;align-items:center;gap:6px}
  .state{padding:12px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="state hint" id="state"></div>
  <div class="map" id="mapBox">
    <svg id="svg" viewBox="0 0 800 560" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="sheet card" id="sheet" hidden></div>
  </div>
  <div class="legend" id="legend"></div>
</div>
<script src="../pages.js"></script>
<script>
/* Карта сети: только просмотр. Данные — /api/netmap (сеть устройств этого
   устройства, та же, что на схеме панели главного сервера). */
const MAIN_IP = '198.19.255.254';
const GLYPH = {windows: 'computer', linux: 'dns', android: 'smartphone', server: 'hub'};
const SYS = {windows: 'Windows', linux: 'Linux', android: 'Android', server: L('Сервер', 'Server')};
let DATA = null, SEL = null;

$('legend').innerHTML =
  `<span><i class="d"></i>${L('напрямую', 'direct')}</span>` +
  `<span><i class="s"></i>${L('через сервер', 'via server')}</span>` +
  `<span><i class="o s"></i>${L('серые — не в сети', 'grey — offline')}</span>`;

function ago(sec){
  if(!sec) return L('давно', 'long ago');
  const d = Math.max(0, Date.now()/1000 - sec);
  if(d < 90) return L('только что', 'just now');
  if(d < 3600) return Math.round(d/60) + L(' мин назад', ' min ago');
  if(d < 86400*2) return Math.round(d/3600) + L(' ч назад', ' h ago');
  return Math.round(d/86400) + L(' дн назад', ' days ago');
}
const ms = v => v ? (v < 10 ? v.toFixed(1) : Math.round(v)) + ' ' + L('мс', 'ms') : '';
const sysText = n => {
  const name = SYS[n.platform] || n.platform || '';
  const os = (n.os || '').trim();
  if(!os) return name || '—';
  return os.toLowerCase().includes(name.toLowerCase()) ? os : (name + ' ' + os).trim();
};

function svgEl(tag, attrs, parent){
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if(parent) parent.appendChild(e);
  return e;
}

function node(g, n, x, y, r, cls){
  const grp = svgEl('g', {class: 'node ' + cls, transform: `translate(${x},${y})`}, g);
  svgEl('circle', {class: 'disc', r}, grp);
  // Значок — тот же файл Material Symbols, что в остальном интерфейсе.
  const s = r * 1.05;
  const fo = svgEl('foreignObject', {x: -s/2, y: -s/2, width: s, height: s}, grp);
  fo.innerHTML = `<div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;display:grid;place-items:center;color:${cls.includes('off') ? 'var(--dim)' : 'var(--accent)'}">${icon(GLYPH[n.platform] || 'computer', '')}</div>`;
  fo.firstChild.firstChild.style.width = fo.firstChild.firstChild.style.height = (s*0.8) + 'px';
  const nm = svgEl('text', {class: 'nm', y: r + 15}, grp);
  nm.textContent = n.name || n.host;
  const sub = svgEl('text', {class: 'sub', y: r + 29}, grp);
  sub.textContent = n.online === false ? ago(n.lastSeen) : (n.self ? L('это устройство', 'this device') : (n.host + '.mesh'));
  grp.onclick = ev => { ev.stopPropagation(); select(n); };
  if(SEL && SEL.ip === n.ip) grp.classList.add('sel');
  return grp;
}

function draw(){
  const svg = $('svg');
  svg.innerHTML = '';
  if(!DATA || !DATA.self) return;
  const W = 800, H = 560, cx = W/2, cy = H/2;
  const nodes = DATA.nodes || [];
  const main = nodes.find(n => n.ip === MAIN_IP) || {name: L('Сервер', 'Server'), host: 'server', ip: MAIN_IP, platform: 'server', online: true, server: true};
  const others = nodes.filter(n => n.ip !== MAIN_IP);
  // Порядок: само устройство, онлайн, офлайн — чтобы карта не прыгала.
  const ring = [Object.assign({}, DATA.self, {self: true, online: true})]
    .concat(others.filter(n => n.online).sort((a, b) => (a.name||'').localeCompare(b.name||'')))
    .concat(others.filter(n => !n.online).sort((a, b) => (a.name||'').localeCompare(b.name||'')));
  const R = Math.min(W, H)/2 - 70;
  const pos = new Map();
  ring.forEach((n, i) => {
    const a = -Math.PI/2 + i * 2*Math.PI / ring.length;
    pos.set(n.ip, [cx + R*Math.cos(a), cy + R*Math.sin(a)]);
  });
  const edges = svgEl('g', {}, svg), lbls = svgEl('g', {}, svg), g = svgEl('g', {}, svg);
  const self = ring[0], [sx, sy] = pos.get(self.ip);
  const label = (x, y, text) => { if(!text) return; const t = svgEl('text', {class: 'lbl', x, y}, lbls); t.textContent = text; };
  for(const n of ring){
    if(!n.online) continue;
    const [x, y] = pos.get(n.ip);
    if(n.direct && !n.self){
      // Прямое соединение с этим устройством, мимо сервера.
      svgEl('line', {class: 'edge p2p', x1: sx, y1: sy, x2: x, y2: y}, edges);
      label((sx+x)/2, (sy+y)/2, ms(n.rttMs));
    } else {
      svgEl('line', {class: 'edge srv', x1: cx, y1: cy, x2: x, y2: y}, edges);
      if(!n.self) label((cx+x)/2, (cy+y)/2, ms(n.rttMs));
    }
  }
  node(g, main, cx, cy, 34, 'server' + (main.online === false ? ' off' : ''));
  for(const n of ring){
    const [x, y] = pos.get(n.ip);
    node(g, n, x, y, 24, (n.self ? 'self ' : '') + (n.server ? 'server ' : '') + (n.online ? '' : 'off'));
  }
  svg.onclick = () => { SEL = null; $('sheet').hidden = true; draw(); };
}

function select(n){
  SEL = n;
  const sh = $('sheet');
  const isDev = !n.server && n.platform !== 'server';
  const how = !n.online ? L('не в сети, был ', 'offline, seen ') + ago(n.lastSeen)
    : n.self ? L('это устройство', 'this device')
    : n.direct ? L('напрямую', 'direct') : L('через сервер', 'via server');
  sh.innerHTML = `<div class="top">${icon(GLYPH[n.platform] || 'computer')}<div style="flex:1;min-width:0">
      <div class="n">${esc(n.name || n.host)}</div><div class="h">${esc(n.host)}.mesh</div></div>
      <button class="ico" id="shClose">${icon('close')}</button></div>
    <dl><dt>${L('Адрес в сети', 'Network address')}</dt><dd>${esc(n.ip)}</dd>
      <dt>${L('Система', 'System')}</dt><dd>${esc(sysText(n))}</dd>
      <dt>${L('Связь', 'Link')}</dt><dd>${esc(how)}${n.rttMs && n.online ? ' · ' + esc(ms(n.rttMs)) : ''}</dd></dl>
    <div class="acts">
      ${isDev ? `<button class="btn" id="shSSH">${icon('terminal')}SSH</button>` : ''}
      ${isDev ? `<button class="btn" id="shFiles">${icon('folder_shared')}${L('Файлы', 'Files')}</button>` : ''}
    </div>`;
  sh.hidden = false;
  $('shClose').onclick = () => { SEL = null; sh.hidden = true; draw(); };
  if($('shSSH')) $('shSSH').onclick = () => goApp('ssh', {add: n.ip, name: n.name || n.host});
  if($('shFiles')) $('shFiles').onclick = () => goApp('files', {peer: n.ip, name: n.name || n.host});
  draw();
}

// goApp — открыть SSH или Файлы для устройства. Не добавлено — добавляем
// (с разрешения): карта ведёт туда же, куда кнопка на плитке.
async function goApp(id, extra){
  let st = await api('/api/addons');
  const e = (st.added || []).find(a => a.id === id);
  if(!e){
    const m = (st.catalog || []).find(c => c.id === id);
    if(!m) return;
    if(!confirm(L(`Добавить приложение «${appName(m)}»?`, `Add the «${appName(m)}» app?`))) return;
    st = await api('/api/addons', {op: 'add', id});
    changed();
  } else if(!e.active){
    alert(L('Приложение выключено — включи его на плитке.', 'The app is off — turn it on on its tile.'));
    return;
  }
  location.href = pageURL('addons/' + id + '.html', extra);
}

async function refresh(){
  try {
    DATA = await api('/api/netmap');
  } catch(e) {
    $('state').textContent = L('Нет связи с программой.', 'No connection to the app.');
    return;
  }
  const st = DATA.state;
  $('state').textContent =
    st === 'off' || st === 'stopped' ? L('Сеть устройств выключена. Включи её кнопкой «Сеть устройств» на главном экране.',
                                         'The device network is off. Turn it on with the «Device network» button on the main screen.')
    : st === 'connecting' ? L('Подключаюсь к сети устройств…', 'Connecting to the device network…')
    : st === 'error' ? L('Ошибка сети устройств: ', 'Device network error: ') + (DATA.error || '')
    : L('Только просмотр: имена и значки меняются в панели главного сервера.', 'View only: names and icons are changed in the main server panel.');
  if(SEL){
    const n = (DATA.nodes || []).find(x => x.ip === SEL.ip) || (DATA.self && DATA.self.ip === SEL.ip ? Object.assign({}, DATA.self, {self: true, online: true}) : null);
    if(n) select(n); else draw();
  } else draw();
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
