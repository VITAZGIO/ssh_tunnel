<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сканер сети</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../pages.css">
<style>
  #netSel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 8px;color:var(--text);font:inherit}
  body{background:transparent}
  .wrap{display:flex;flex-direction:column;gap:10px;padding:12px 14px 16px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .bar .btn{display:inline-flex;align-items:center;gap:6px}
  .meter{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;flex:1;min-width:120px}
  .meter i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .host{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:9px 0;border-bottom:1px solid var(--line)}
  .host:last-child{border-bottom:0}
  .host .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .host .n small{font-weight:400;color:var(--ok);margin-left:6px}
  .host .ip{font-family:var(--mono);font-size:13px}
  .host .d{grid-column:1/2;color:var(--dim);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
  .host .d span{font-family:var(--mono)}
  .host .pt{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
  .host .pt span{font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
  .host .rt{color:var(--dim);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
  .host .acts{grid-column:2/3;grid-row:1/3;display:flex;gap:6px;align-items:center;justify-content:flex-end}
  .host .acts .btn{padding:5px 10px;font-size:13px;display:inline-flex;gap:5px;align-items:center}
  .host .acts .mi{width:16px;height:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <button class="btn primary" id="go"></button>
    <select id="netSel" hidden></select>
    <div class="meter" id="meter" hidden><i id="bar"></i></div>
    <span class="hint" id="state"></span>
  </div>
  <div class="card" id="list"></div>
  <div class="hint" id="note"></div>
</div>
<script src="../pages.js"></script>
<script>
let R = null, timer = 0;

// goApp — SSH для найденного адреса: приложение не добавлено — добавляем
// с разрешения (как в «Карте сети»).
async function goApp(id, extra){
  let st = await api('/api/addons');
  const e = (st.added || []).find(a => a.id === id);
  if(!e){
    const m = (st.catalog || []).find(c => c.id === id);
    if(!m) return;
    if(!confirm(L(`Добавить приложение «${appName(m)}»?`, `Add the «${appName(m)}» app?`))) return;
    st = await api('/api/addons', {op: 'add', id});
    changed();
  }
  location.href = pageURL('addons/' + id + '.html', extra);
}

// Что за порт — подпись на плашке.
const PORTS = {22: 'SSH', 53: 'DNS', 80: 'HTTP', 139: 'NetBIOS', 443: 'HTTPS', 445: 'SMB', 554: L('камера', 'camera') + ' RTSP',
  631: L('принтер', 'printer'), 1883: 'MQTT', 3389: L('удал. стол', 'RDP'), 5000: 'NAS', 5001: 'NAS', 8006: 'Proxmox',
  8080: 'HTTP', 8123: 'Home Assistant', 8443: 'HTTPS', 9100: L('принтер', 'printer')};
// kindOf — что это, скорее всего, по открытым портам (как угадывают сканеры).
function kindOf(h){
  const p = new Set(h.ports);
  if(p.has(8006)) return 'Proxmox';
  if(p.has(8123)) return 'Home Assistant';
  if(p.has(3389) || (p.has(445) && p.has(139))) return 'Windows';
  if(p.has(9100) || p.has(631)) return L('Принтер', 'Printer');
  if(p.has(554)) return L('Камера', 'Camera');
  if(p.has(5000) || p.has(5001)) return 'NAS';
  if(p.has(53) && (p.has(80) || p.has(443))) return L('Роутер или DNS', 'Router or DNS');
  if(p.has(22) && !p.has(445)) return 'Linux';
  return '';
}
function render(){
  const r = R || {hosts: []};
  $('go').innerHTML = icon('radar') + esc(r.running ? L('Ищу…', 'Scanning…') : L('Сканировать', 'Scan'));
  $('go').disabled = !!r.running;
  // Несколько сетей (Wi-Fi, кабель, виртуальные) — можно выбрать, какую смотреть.
  const nets = r.nets || [];
  $('netSel').hidden = nets.length < 2;
  $('netSel').disabled = !!r.running;
  if(nets.length > 1) $('netSel').innerHTML = nets.map(n =>
    `<option value="${esc(n.subnet)}"${n.subnet === r.subnet ? ' selected' : ''}>${esc(n.iface)} · ${esc(n.subnet)}</option>`).join('');
  $('meter').hidden = !r.running;
  $('bar').style.width = (r.total ? r.done * 100 / r.total : 0) + '%';
  $('state').textContent = r.error ? r.error
    : r.subnet ? `${r.iface ? r.iface + ' · ' : ''}${r.subnet} · ${L('найдено', 'found')}: ${r.hosts.length}` + (r.running ? '' : r.tookMs ? ` · ${(r.tookMs / 1000).toFixed(0)} ${L('с', 's')}` : '')
    : '';
  $('list').hidden = !r.hosts.length;
  $('list').innerHTML = r.hosts.map(h => {
    const kind = kindOf(h);
    const title = h.name || h.vendor || kind || L('Неизвестное устройство', 'Unknown device');
    const mac = h.mac ? h.mac : '—';
    const vend = h.vendor || (h.randomMac ? L('частный MAC', 'private MAC') : h.mac ? L('производитель неизвестен', 'unknown vendor') : '—');
    const acts = [];
    // SSH — терминал этого устройства в приложении «SSH» (порт 22 открыт;
    // на Windows это встроенный OpenSSH Server).
    if(h.ports.includes(22)) acts.push(`<button class="btn" title="${esc(L('Открыть терминал в приложении «SSH»', 'Open a terminal in the SSH app'))}" data-ssh="${esc(h.ip)}" data-nm="${esc(h.name || '')}">${icon('terminal')}${L('Терминал', 'Terminal')}</button>`);
    // Веб-панель — самая «говорящая»: Proxmox, Home Assistant, потом обычный сайт.
    const web = h.ports.includes(8006) ? `https://${h.ip}:8006/` : h.ports.includes(8123) ? `http://${h.ip}:8123/`
      : h.ports.includes(443) ? `https://${h.ip}/` : h.ports.includes(80) ? `http://${h.ip}/`
      : h.ports.includes(8443) ? `https://${h.ip}:8443/` : h.ports.includes(8080) ? `http://${h.ip}:8080/` : '';
    if(web) acts.push(`<button class="btn" data-web="${esc(web)}">${icon('open_in_new')}${L('Открыть', 'Open')}</button>`);
    return `<div class="host">
      <div class="n">${esc(title)}${h.self ? `<small>${L('это устройство', 'this device')}</small>` : ''}</div>
      <div class="acts">${acts.join('')}</div>
      <div class="d"><span class="ip">${esc(h.ip)}</span>${h.mac || !ANDROID ? `<span>${esc(mac)}</span>` : ''}${kind && kind !== title ? `<em>${esc(kind)}</em>` : ''}${title !== h.vendor && (h.vendor || h.mac) ? `<em>${esc(vend)}</em>` : ''}${h.rttMs ? `<em>${h.rttMs} ${L('мс', 'ms')}</em>` : ''}</div>
      ${h.ports.length ? `<div class="pt">${h.ports.map(p => `<span title="${p}">${esc(PORTS[p] || p)}</span>`).join('')}</div>` : ''}
    </div>`;
  }).join('');
  $('list').querySelectorAll('[data-ssh]').forEach(b => b.onclick = () => goApp('ssh', {add: b.dataset.ssh, name: b.dataset.nm || b.dataset.ssh}));
  $('list').querySelectorAll('[data-web]').forEach(b => b.onclick = () => openExternal(b.dataset.web));
  $('note').textContent = r.hosts.length ? L('Ничего не запоминается: каждый раз свежий список. Тип устройства угадывается по открытым портам.' + (ANDROID ? ' MAC-адреса чужих устройств Android приложениям не даёт (с Android 10) — их покажет ssh_tunnel на компьютере.' : ''),
    'Nothing is remembered: a fresh list every time. The device type is guessed from open ports.' + (ANDROID ? ' Android does not give apps the MAC addresses of other devices (since Android 10) — ssh_tunnel on a computer shows them.' : '')) : '';
  clearTimeout(timer);
  if(r.running) timer = setTimeout(poll, 700);
}

async function poll(){ try { R = await api('/api/lanscan'); } catch(e) { R = {error: String(e), hosts: []}; } render(); }
async function scan(){ try { R = await api('/api/lanscan', {net: $('netSel').hidden ? '' : $('netSel').value}); } catch(e) { R = {error: String(e), hosts: []}; } render(); }

$('go').onclick = scan;
$('netSel').onchange = scan;
render();
// Открыли — сразу ищем, если ещё не идёт.
api('/api/lanscan').then(r => { R = r; if(!r.running) scan(); else render(); });
</script>
</body>
</html>
