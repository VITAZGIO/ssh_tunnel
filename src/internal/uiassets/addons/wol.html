<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Включить по сети</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../pages.css">
<style>
  body{background:transparent}
  .wrap{display:flex;flex-direction:column;gap:10px;padding:12px 14px 16px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bar input,.bar select{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);font:inherit;flex:1;min-width:140px}
  .btn{display:inline-flex;align-items:center;gap:6px}
  .h{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .h:last-child{border-bottom:0}
  .h>.mi{width:26px;height:26px;color:var(--dim)}
  .h.up>.mi{color:var(--ok)}
  .h .n{font-weight:600}
  .h .m{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .h .s{font-size:12.5px;color:var(--dim)}
  .h.up .s{color:var(--ok)}
  .h .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .h .st{grid-column:1/-1;font-size:12.5px}
  .ok{color:var(--ok)}.err{color:var(--err)}
  .sug{display:flex;gap:6px;flex-wrap:wrap}
  .sug button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;font-size:12.5px}
  details summary{cursor:pointer;font-weight:600}
  ol{margin:8px 0 0;padding-left:20px;font-size:13px;line-height:1.6}
  .ck{display:flex;gap:10px;align-items:center;font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="list"></div>
  <div class="card">
    <div class="bar"><input id="name"><input id="mac" spellcheck="false" autocapitalize="characters"></div>
    <div class="bar" style="margin-top:8px"><select id="via"></select><select id="peer"></select></div>
    <div class="bar" style="margin-top:8px"><button class="btn primary" id="add"></button><button class="btn" id="cancel" hidden></button></div>
    <div class="hint" id="sugT" style="margin-top:10px" hidden></div>
    <div class="sug" id="sug"></div>
  </div>
  <div class="card" id="selfCard" hidden>
    <label class="ck"><input type="checkbox" id="allow"><span id="allowL"></span></label>
  </div>
  <div class="card"><details id="how"><summary id="howT"></summary><div id="howB"></div></details></div>
  <div class="hint" id="note"></div>
</div>
<script src="../pages.js"></script>
<script>
/* Включить по сети (Wake-on-LAN) и, если донастроено, выключить. Включение
   — «волшебный пакет» в локалку (отсюда или руками своих устройств в сети
   устройств). Выключение — просьба самой машине через сеть устройств: на
   ней стоит ssh_tunnel с этим плагином и разрешено «выключать по сети». */
let ST = {hosts: [], peers: [], online: {}}, EDIT = null;
const status = {};
const VIA = {'': L('включать отсюда и через сеть устройств', 'wake from here and via the device network'), local: L('включать только отсюда (локально)', 'wake only from here (local)'), mesh: L('включать через сеть устройств', 'wake via the device network')};

function draw(){
  $('list').innerHTML = ST.hosts.length ? ST.hosts.map(h => {
    const known = !!h.peer, up = known && ST.online[h.peer];
    const peer = ST.peers.find(p => p.ip === h.peer);
    return `<div class="h${up ? ' up' : ''}">${icon('power_settings_new')}
      <div><div class="n">${esc(h.name)}</div><div class="m">${esc(h.mac)}</div>
        <div class="s">${known ? (up ? '● ' + esc(L('включён', 'on')) : '○ ' + esc(L('выключен или не в сети', 'off or offline'))) + (peer ? ' · ' + esc(peer.name) : '') : esc(L('выключение не настроено', 'shutdown not set up'))}</div></div>
      <div class="acts">
        <button class="btn primary" data-wake="${esc(h.mac)}">${esc(L('Включить', 'Wake'))}</button>
        ${known ? `<button class="btn" data-off="${esc(h.mac)}">${esc(L('Выключить', 'Shut down'))}</button>` : ''}
        <button class="ico" data-ed="${esc(h.mac)}" title="${esc(L('Изменить', 'Edit'))}">${icon('edit')}</button>
        <button class="ico" data-rm="${esc(h.mac)}" title="${esc(L('Убрать', 'Remove'))}">${icon('close')}</button></div>
      ${status[h.mac] ? `<div class="st ${status[h.mac][1]}">${esc(status[h.mac][0])}</div>` : ''}</div>`;
  }).join('') : `<div class="empty" style="padding:20px">${esc(L('Машин пока нет. Впиши имя и MAC ниже — MAC видно в «Сканере сети» на компьютере или в настройках роутера.', 'No machines yet. Enter a name and MAC below.'))}</div>`;
  $('list').querySelectorAll('[data-wake]').forEach(b => b.onclick = async () => {
    const mac = b.dataset.wake;
    status[mac] = [L('Отправляю…', 'Sending…'), '']; draw();
    const r = await api('/api/wol', {op: 'wake', mac}).catch(e => ({error: String(e)}));
    status[mac] = r.error ? [r.error, 'err'] : [L('Отправили: ', 'Sent by: ') + (r.sent || []).join(', ') + L(' — включится за 10–60 с, если WoL у неё включён.', ' — wakes in 10–60 s if WoL is on.')
      + ((r.failed || []).length ? ' ' + L('Не смогли: ', 'Failed: ') + r.failed.join('; ') : ''), 'ok'];
    draw();
  });
  $('list').querySelectorAll('[data-off]').forEach(b => b.onclick = async () => {
    const h = ST.hosts.find(x => x.mac === b.dataset.off);
    if(!confirm(L(`Выключить «${h.name}»? Через 30 секунд — несохранённое там пропадёт.`, `Shut down «${h.name}» in 30 s?`))) return;
    const r = await api('/api/wol', {op: 'shutdown', mac: h.mac}).catch(e => ({error: String(e)}));
    status[h.mac] = r.error ? [r.error, 'err'] : [L('Выключится через 30 секунд.', 'Shuts down in 30 s.'), 'ok'];
    draw();
  });
  $('list').querySelectorAll('[data-ed]').forEach(b => b.onclick = () => {
    const h = ST.hosts.find(x => x.mac === b.dataset.ed); EDIT = h.mac;
    $('name').value = h.name; $('mac').value = h.mac; $('via').value = h.via || ''; fillPeers(h.peer || '');
    $('add').innerHTML = esc(L('Сохранить', 'Save')); $('cancel').hidden = false; $('name').focus();
  });
  $('list').querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    const h = ST.hosts.find(x => x.mac === b.dataset.rm);
    if(!h || !confirm(L(`Убрать «${h.name}» из списка?`, `Remove «${h.name}»?`))) return;
    await api('/api/wol', {op: 'remove', mac: h.mac}); load();
  });
}
function fillPeers(cur){
  $('peer').innerHTML = `<option value="">${esc(L('выключение: не настроено', 'shutdown: not set up'))}</option>` +
    (ST.peers || []).map(p => `<option value="${esc(p.ip)}"${p.ip === cur ? ' selected' : ''}>${esc(L('выключать как: ', 'shut down as: ') + p.name)}</option>`).join('');
}
function resetForm(){
  EDIT = null; $('name').value = $('mac').value = ''; $('via').value = ''; fillPeers('');
  $('add').innerHTML = icon('add') + esc(L('Добавить', 'Add')); $('cancel').hidden = true;
}

async function load(){
  const r = await api('/api/wol').catch(() => null);
  if(r && r.hosts){ ST = r; ST.peers = ST.peers || []; ST.online = ST.online || {}; }
  draw();
  if(!EDIT) fillPeers($('peer').value);
  $('selfCard').hidden = !ST.canShutdown;
  $('allow').checked = !!(ST.settings && ST.settings.allowShutdown);
  // Подсказка из «Сканера сети»: найденные с MAC — добавить одним нажатием.
  const s = await api('/api/lanscan').catch(() => null);
  const known = new Set(ST.hosts.map(h => h.mac));
  const list = ((s && s.hosts) || []).filter(h => h.mac && !h.self && !known.has(h.mac.toLowerCase()));
  $('sugT').hidden = !list.length;
  $('sugT').textContent = L('Из «Сканера сети»:', 'From the Network scanner:');
  $('sug').innerHTML = list.slice(0, 20).map(h => `<button data-m="${esc(h.mac)}" data-n="${esc(h.name || h.vendor || h.ip)}">${esc(h.name || h.ip)}</button>`).join('');
  $('sug').querySelectorAll('button').forEach(b => b.onclick = () => { $('name').value = b.dataset.n; $('mac').value = b.dataset.m; });
}

$('name').placeholder = L('имя, например «ПК»', 'name, e.g. «PC»');
$('mac').placeholder = 'AA:BB:CC:DD:EE:FF';
$('via').innerHTML = Object.entries(VIA).map(([v, t]) => `<option value="${v}">${esc(t)}</option>`).join('');
$('cancel').textContent = L('Отмена', 'Cancel'); $('cancel').onclick = resetForm;
$('add').onclick = async () => {
  if(EDIT && EDIT !== $('mac').value.trim().toLowerCase()) await api('/api/wol', {op: 'remove', mac: EDIT});
  const r = await api('/api/wol', {op: 'add', name: $('name').value.trim(), mac: $('mac').value.trim(), via: $('via').value, peer: $('peer').value}).catch(e => ({error: String(e)}));
  if(r.error){ $('note').textContent = r.error; $('note').className = 'hint err'; return; }
  $('note').className = 'hint'; $('note').textContent = '';
  resetForm(); load();
};
$('allowL').textContent = L('Разрешить своим устройствам выключать это устройство (через 30 с, по сети устройств)', 'Let my devices shut this device down (in 30 s, via the device network)');
$('allow').onchange = () => api('/api/wol', {op: 'settings', allowShutdown: $('allow').checked});
$('howT').textContent = L('Как настроить выключение', 'How to set up shutdown');
$('howB').innerHTML = `<ol>
  <li>${esc(L('Поставь ssh_tunnel на ту машину (с сайта релизов) и включи на ней «Сеть устройств» с тем же ключом сети.', 'Install ssh_tunnel on that machine and turn on the device network with the same key.'))}</li>
  <li>${esc(L('Там же добавь этот плагин «Включить по сети» и поставь галку «Разрешить своим устройствам выключать это устройство».', 'Add this plugin there and tick «Let my devices shut this device down».'))}</li>
  <li>${esc(L('Здесь: «Изменить» у машины → в списке «выключать как» выбери её имя в сети устройств → «Сохранить».', 'Here: Edit the machine → pick its device-network name in «shut down as» → Save.'))}</li></ol>
  <p class="hint">${esc(L('Тогда у машины видно, включена ли она, и появится «Выключить». Для включения ничего этого не нужно: хватает MAC и Wake-on-LAN в BIOS.', 'Then you see if it is on and get «Shut down». Waking needs only the MAC and Wake-on-LAN in BIOS.'))}</p>`;
$('note').textContent = L('Включение: у машины должен быть Wake-on-LAN — в BIOS и в свойствах сетевой карты (Windows: «Разрешить этому устройству выводить компьютер из ждущего режима» и «Wake on Magic Packet»); по Wi-Fi обычно не просыпается — нужен кабель. Не из дома — «через сеть устройств»: пакет пошлют твои устройства в одной локалке с машиной (домашний сервер), если на них тоже добавлен этот плагин.',
  'Waking needs Wake-on-LAN in BIOS and the network card; usually over a cable. Away from home use «via the device network».');
resetForm();
load();
setInterval(() => { if(!document.hidden && !EDIT) load(); }, 15000);
</script>
</body>
</html>
