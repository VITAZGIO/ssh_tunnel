<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Общий буфер</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../pages.css">
<style>
  body{background:transparent}
  .wrap{display:flex;flex-direction:column;gap:10px;padding:12px 14px 16px}
  textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:64px;resize:vertical;width:100%;box-sizing:border-box}
  .send{display:flex;flex-direction:column;gap:8px}
  .send .f{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:6px}
  .btn .mi{width:16px;height:16px}
  .it{display:grid;grid-template-columns:22px 1fr auto;gap:3px 10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
  .it:last-child{border-bottom:0}
  .it > .mi{color:var(--dim);margin-top:2px}
  .it.out > .mi{color:var(--accent)}
  .it .tx{white-space:pre-wrap;word-break:break-word;max-height:7.5em;overflow:hidden;font-size:14px}
  .it .meta{grid-column:2/3;color:var(--dim);font-size:12px}
  .it img{max-width:100%;max-height:180px;border-radius:8px;display:block}
  .it .tools{grid-row:1/3;grid-column:3/4;display:flex;gap:2px}
  .it .tools .ico{width:30px;height:30px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hint" id="state"></div>
  <div class="card send">
    <textarea id="text"></textarea>
    <div class="f">
      <button class="btn primary" id="sendText"></button>
      <button class="btn" id="sendFile"></button>
      <input type="file" id="file" hidden>
      <span class="hint" id="msg"></span>
    </div>
  </div>
  <div class="card" id="acc" hidden>
    <b id="accT"></b>
    <div class="hint" id="accS"></div>
    <ol class="hint" id="accHow" style="margin:6px 0 6px 18px;padding:0"></ol>
    <div class="f">
      <button class="btn primary" id="accOpen"></button>
      <button class="btn" id="accInfo"></button>
    </div>
  </div>
  <div class="card" id="list"></div>
  <div class="f"><button class="btn" id="clear"></button></div>
  <div class="hint" id="note"></div>
</div>
<script src="../pages.js"></script>
<script>
let SEQ = 0, ITEMS = [], MAX = 50 << 20;

function human(b){
  if(b >= 1e6) return (b / 1e6).toFixed(1) + L(' МБ', ' MB');
  if(b >= 1e3) return Math.round(b / 1e3) + L(' КБ', ' KB');
  return b + L(' Б', ' B');
}
const dataURL = (it, dl) => `/api/clipboard/data?id=${encodeURIComponent(it.id)}&t=${encodeURIComponent(T)}${dl ? '&dl=1' : ''}`;
const msg = t => { $('msg').textContent = t; setTimeout(() => { if($('msg').textContent === t) $('msg').textContent = ''; }, 5000); };

$('text').placeholder = L('Текст для всех устройств…', 'Text for all devices…');
$('sendText').innerHTML = icon('upload') + esc(L('Отправить', 'Send'));
$('sendFile').innerHTML = icon('draft') + esc(L('Картинка или файл', 'Image or file'));
$('clear').innerHTML = icon('delete') + esc(L('Очистить историю', 'Clear history'));

async function push(kind, name, mime, body){
  const q = new URLSearchParams({kind, name, mime, lang: LANG});
  try {
    const r = await fetch('/api/clipboard/push?' + q, {method: 'POST', headers: {'X-Token': T}, body}).then(r => r.json());
    if(r.error) msg(r.tooBig ? L('Больше 50 МБ — передай через «Файлы устройства».', 'Over 50 MB — use Device files.') : r.error);
    else msg(L(`Отправлено устройств: ${r.item.sent || 0}`, `Sent to devices: ${r.item.sent || 0}`));
  } catch(e) { msg(String(e)); }
  refresh();
}

$('sendText').onclick = () => { const t = $('text').value; if(t){ push('text', '', '', t); $('text').value = ''; } };
$('sendFile').onclick = () => $('file').click();
$('file').onchange = () => {
  const f = $('file').files[0];
  $('file').value = '';
  if(!f) return;
  if(f.size > MAX){ msg(L('Больше 50 МБ — передай через «Файлы устройства».', 'Over 50 MB — use Device files.')); return; }
  push(f.type === 'image/png' ? 'image' : 'file', f.name, f.type, f);
};
$('clear').onclick = async () => {
  if(!confirm(L('Удалить всю историю на этом устройстве?', 'Delete the whole history on this device?'))) return;
  await api('/api/clipboard/delete', {all: true});
  ITEMS = []; render();
};

async function copyText(it){
  try {
    const t = await fetch(dataURL(it)).then(r => r.text());
    await navigator.clipboard.writeText(t);
    msg(L('Скопировано.', 'Copied.'));
  } catch(e) { msg(L('Не вышло скопировать: ', 'Could not copy: ') + e); }
}

function render(){
  $('list').hidden = !ITEMS.length;
  $('clear').hidden = !ITEMS.length;
  $('list').innerHTML = ITEMS.map(it => {
    const when = new Date(it.at * 1000).toLocaleString(LANG === 'en' ? 'en-GB' : 'ru-RU', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'});
    const who = it.out ? L(`отсюда → ${it.sent || 0} устр.`, `from here → ${it.sent || 0} dev.`) : L('с ', 'from ') + (it.from || '?');
    let body;
    if(it.gone) body = `<div class="hint">${esc(it.name || it.kind)} — ${L('удалено, чтобы не занимать место', 'removed to save space')}</div>`;
    else if(it.kind === 'text') body = `<div class="tx">${esc(it.preview || '')}</div>`;
    else if(it.kind === 'image') body = `<img src="${dataURL(it)}" alt="">`;
    else body = `<div class="tx">${esc(it.name || 'file')}</div>`;
    const tools = [];
    if(!it.gone && it.kind === 'text') tools.push(`<button class="ico" data-copy="${esc(it.id)}" title="${L('Скопировать', 'Copy')}">${icon('content_copy')}</button>`);
    if(!it.gone && it.kind !== 'text' && !ANDROID) tools.push(`<a class="ico" href="${dataURL(it, true)}" title="${L('Скачать', 'Download')}">${icon('download')}</a>`);
    tools.push(`<button class="ico" data-del="${esc(it.id)}" title="${L('Удалить', 'Delete')}">${icon('close')}</button>`);
    return `<div class="it ${it.out ? 'out' : ''}">${icon(it.kind === 'text' ? 'content_paste' : it.kind === 'image' ? 'image' : 'draft')}
      ${body}<div class="tools">${tools.join('')}</div>
      <div class="meta">${esc(when)} · ${esc(who)}${it.kind !== 'text' ? ' · ' + esc(human(it.size)) : ''}</div></div>`;
  }).join('');
  $('list').querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copyText(ITEMS.find(i => i.id === b.dataset.copy)));
  $('list').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    await api('/api/clipboard/delete', {id: b.dataset.del});
    ITEMS = ITEMS.filter(i => i.id !== b.dataset.del); render();
  });
}

function state(r){
  const off = r.mesh === 'off' || r.mesh === 'stopped';
  $('state').textContent = off ? L('Сеть устройств выключена — буфер не передаётся.', 'The device network is off — nothing is shared.')
    : ANDROID ? L('Отсюда: «Поделиться → ssh_tunnel», плитка «Общий буфер» в шторке или кнопка «Отправить буфер» в уведомлении. Сюда — само.', 'From here: Share → ssh_tunnel, the «Shared clipboard» quick tile or the “Send clipboard” notification button. To here — automatically.')
    : L('Скопированное на этом устройстве уходит остальным само, полученное — сразу в буфер.', 'What you copy here goes to the others automatically; what arrives goes straight to the clipboard.');
  $('note').textContent = L('Хранятся последние 20 записей. Участие — выключатель на плитке приложения на каждом устройстве.',
    'The last 20 entries are kept. Taking part is the switch on the app tile, on each device.');
}

async function refresh(){
  const r = await api('/api/clipboard');
  if(r.error){ $('state').textContent = r.error; return; }
  MAX = r.max || MAX; SEQ = r.seq; ITEMS = r.items || [];
  state(r); render();
}

// Новое — длинным запросом: ответ приходит, как только запись появилась.
async function watch(){
  for(;;){
    try {
      const r = await api('/api/clipboard?after=' + SEQ + '&wait=1');
      if(r.error){ await new Promise(f => setTimeout(f, 5000)); continue; }
      if(r.items && r.items.length){ const have = new Set(ITEMS.map(i => i.id)); ITEMS = r.items.filter(i => !have.has(i.id)).concat(ITEMS).slice(0, 20); render(); }
      SEQ = Math.max(SEQ, r.seq);
      state(r);
    } catch(e) { await new Promise(f => setTimeout(f, 3000)); }
  }
}

// Android: служба спецвозможностей — отправка буфера сразу после «Копировать».
function accRender(){
  const A = window.SSHTunnelAndroid;
  if(!ANDROID || !A || !A.clipAccess){ return; }
  $('acc').hidden = false;
  const on = A.clipAccess();
  $('accT').textContent = L('Отправлять сразу после «Копировать»', 'Send right after “Copy”');
  $('accS').textContent = on ? L('✓ Включено. Скопировал в любом приложении — буфер уходит сам.', '✓ On. Copy in any app and the clipboard is sent automatically.')
    : L('Выключено. Без этого буфер уходит кнопкой в уведомлении, плиткой или при открытии ssh_tunnel.', 'Off. Without it the clipboard goes with the notification button, the tile, or when ssh_tunnel is opened.');
  $('accHow').innerHTML = [
    L('Нажми «Открыть настройки спецвозможностей» → «Установленные службы» → ssh_tunnel → включить.', 'Tap “Open accessibility settings” → Installed services → ssh_tunnel → turn on.'),
    L('Если переключатель серый или пишет «Ограниченная настройка» (Android 13+, приложение установлено не из магазина): «Страница приложения» → меню ⋮ вверху справа → «Разрешить ограниченные настройки», затем повтори п. 1.', 'If the switch is greyed out or says “Restricted setting” (Android 13+, app not from a store): “App page” → ⋮ menu → “Allow restricted settings”, then repeat step 1.'),
    L('Служба видит только факт нажатия кнопки «Копировать» (её подпись); содержимое экрана не читается.', 'The service only sees that a “Copy” button was tapped (its label); screen content is not read.'),
    L('На HiOS/Tecno, если перестало работать: разрешить автозапуск и снять ограничение батареи для ssh_tunnel.', 'On HiOS/Tecno, if it stops working: allow autostart and remove battery restrictions for ssh_tunnel.')
  ].map(x => `<li>${esc(x)}</li>`).join('');
  $('accOpen').textContent = L('Открыть настройки спецвозможностей', 'Open accessibility settings');
  $('accInfo').textContent = L('Страница приложения', 'App page');
  $('accOpen').onclick = () => A.openClipAccess();
  $('accInfo').onclick = () => A.openAppInfo();
}
accRender();
document.addEventListener('visibilitychange', accRender);
window.addEventListener('focus', accRender);

refresh().then(watch);
</script>
</body>
</html>
