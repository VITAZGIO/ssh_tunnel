<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Образец</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../pages.css">
<style>
  body{background:transparent}
  .box{margin:14px;display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<!-- Образец плагина: страница пустая, только показывает,
     что каркас её открыл и она работает. В релизе его нет. -->
<div class="box">
  <div class="card" id="text"></div>
  <div class="hint" id="clock"></div>
</div>
<script>
const Q = new URLSearchParams(location.search);
const en = Q.get('lang') === 'en';
if(Q.get('theme')) document.documentElement.dataset.theme = Q.get('theme');
document.getElementById('text').textContent = en
  ? 'The sample app is open. It does nothing — it only checks that the framework works.'
  : 'Образец открыт. Он ничего не делает — только проверяет, что каркас работает.';
const tick = () => document.getElementById('clock').textContent =
  (en ? 'Page time: ' : 'Время на странице: ') + new Date().toLocaleTimeString();
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
